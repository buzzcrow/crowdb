name: DockerPreview

on:
  workflow_dispatch:

jobs:
  DockerPreview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Build and test single-node preview image
      env:
        CROWDB_PREVIEW_TEST_ARTIFACTS: ${{ runner.temp }}/crowdb-preview-artifacts
      run: pixi run test-single-node-container
    - name: Capture Docker diagnostics on failure
      if: failure()
      run: |
        docker ps -a
        docker images
        docker info
        df -h
    - name: Upload preview failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: docker-preview-${{ github.run_attempt }}
        path: ${{ runner.temp }}/crowdb-preview-artifacts
        if-no-files-found: ignore
        retention-days: 7
