name: Required S3 FUSE compatibility gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mount:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install host prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler fuse3
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
      - uses: Swatinem/rust-cache@v2
      - name: Require real mounted operations
        run: pixi run -e s3-e2e test-s3fs-required
      - name: Clean services
        if: always()
        run: pixi run clean-env
