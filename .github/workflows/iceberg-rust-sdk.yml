name: IcebergRustSDK

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 1

jobs:
  IcebergRustSDK:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - uses: Swatinem/rust-cache@v2
    - name: Run Rust Iceberg SDK acceptance
      run: pixi run -e iceberg-e2e test-rust-iceberg-e2e
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-iceberg-rust-sdk-${{ github.run_attempt }}
        path: .crowdb-runtime/
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env
