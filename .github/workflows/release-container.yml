name: Publish crowdb-iceberge docker container

on:
  workflow_dispatch:

concurrency:
  group: crowdb-iceberg-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      image_tag: ${{ steps.source.outputs.image_tag }}
      runtime_sha256: ${{ steps.runtime_digest.outputs.sha256 }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Install host test prerequisites
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Verify release source
      id: source
      run: |
        pixi run bash -euc '
          [[ "$GITHUB_REPOSITORY" == buzzcrow/crowdb ]]
          [[ "$GITHUB_REF" =~ ^refs/heads/release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          branch_version=${BASH_REMATCH[1]}
          version=$(cat VERSION)
          if [[ "$version" != "$branch_version" ]]; then
            echo "::error::VERSION is $version but release branch requires $branch_version" >&2
            exit 1
          fi
          revision=$(git rev-parse HEAD)
          [[ "$revision" == "$GITHUB_SHA" ]]
          printf "version=%s\nrevision=%s\nimage_tag=%s\n" "$version" "$revision" "$version" >> "$GITHUB_OUTPUT"
        '
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Build and test image without publication credentials
      env:
        CROWDB_PREVIEW_TEST_ARTIFACTS: ${{ runner.temp }}/crowdb-preview-artifacts
      run: pixi run test-single-node-container
    - name: Archive verified runtime files
      run: pixi run tar -C target/container-runtime -czf target/container-runtime.tar.gz .
    - name: Record verified runtime digest
      run: pixi run bash -euc 'printf "sha256=%s\n" "$(sha256sum target/container-runtime.tar.gz | cut -d " " -f1)" >> "$GITHUB_OUTPUT"'
      id: runtime_digest
    - uses: actions/upload-artifact@v4
      with:
        name: verified-container-runtime
        path: target/container-runtime.tar.gz
        compression-level: 0
        retention-days: 7
    - name: Upload preview failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: release-preview-${{ github.run_attempt }}
        path: ${{ runner.temp }}/crowdb-preview-artifacts
        if-no-files-found: ignore
        retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: DockerHub
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.verify.outputs.revision }}
        fetch-depth: 0
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Require publication credentials and current release branch head
      env:
        IMAGE_TAG: ${{ needs.verify.outputs.image_tag }}
        REVISION: ${{ needs.verify.outputs.revision }}
        RELEASE_BRANCH: ${{ github.ref_name }}
        DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        pixi run bash -euc '
          [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]
          [[ "$(git rev-parse HEAD)" == "$REVISION" ]]
          [[ "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)" == "$REVISION" ]]
          [[ "$IMAGE_TAG" == "$(cat VERSION)" ]]
        '
    - uses: docker/setup-buildx-action@v4
    - uses: actions/download-artifact@v4
      with:
        name: verified-container-runtime
        path: target
    - name: Extract verified runtime files
      env:
        RUNTIME_SHA256: ${{ needs.verify.outputs.runtime_sha256 }}
      run: |
        pixi run bash -euc '[[ "$(sha256sum target/container-runtime.tar.gz | cut -d " " -f1)" == "$RUNTIME_SHA256" ]]'
        pixi run bash -euc 'mkdir -p target/container-runtime && tar -C target/container-runtime -xzf target/container-runtime.tar.gz'
        pixi run rm target/container-runtime.tar.gz
    - uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Confirm release branch head before image push
      env:
        REVISION: ${{ needs.verify.outputs.revision }}
        RELEASE_BRANCH: ${{ github.ref_name }}
      run: pixi run bash -euc '[[ "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)" == "$REVISION" ]]'
    - name: Build and replace release branch image with attestations
      id: build
      uses: docker/build-push-action@v7
      with:
        context: target/container-runtime
        file: container/single-node-container/Dockerfile
        platforms: linux/amd64
        push: true
        provenance: mode=max
        sbom: true
        build-args: |
          SOURCE_REVISION=${{ needs.verify.outputs.revision }}
          PREVIEW_VERSION=${{ needs.verify.outputs.version }}
          RUNTIME_SHA256=${{ needs.verify.outputs.runtime_sha256 }}
        tags: |
          docker.io/crowdb/crowdb-iceberg:${{ needs.verify.outputs.image_tag }}
          docker.io/crowdb/crowdb-iceberg:latest
    - uses: sigstore/cosign-installer@v4.1.2
    - name: Sign published digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: pixi run cosign sign --yes "docker.io/crowdb/crowdb-iceberg@$DIGEST"
