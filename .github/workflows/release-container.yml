name: Publish crowdb-iceberge docker container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git release tag to publish
        required: true
        type: string
      include_symbols:
        description: Build and attach the large exact-build symbol archive
        required: false
        default: false
        type: boolean

concurrency:
  group: crowdb-iceberg-single-node-preview-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CROWDB_PACKAGE_SYMBOLS: ${{ inputs.include_symbols && '1' || '0' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Install host test prerequisites
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Verify release source
      id: source
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        GH_TOKEN: ${{ github.token }}
      run: |
        pixi run bash -euc '
          [[ "$GITHUB_REPOSITORY" == buzzcrow/crowdb ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_TAG" == "v$(cat VERSION)" ]]
          revision=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$revision" == "$(git rev-parse HEAD)" ]]
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          printf "version=%s\nrevision=%s\n" "${RELEASE_TAG#v}" "$revision" >> "$GITHUB_OUTPUT"
        '
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Build and test image without publication credentials
      env:
        CROWDB_PREVIEW_TEST_ARTIFACTS: ${{ runner.temp }}/crowdb-preview-artifacts
      run: pixi run test-single-node-container
    - name: Free preview build artifacts before acceptance tests
      run: |
        pixi run docker image rm crowdb-iceberg-single-node:dev
        pixi run docker builder prune --all --force
        pixi run cargo clean --release
        pixi run df -h /
    - name: Run S3 client acceptance
      run: pixi run clean-env && pixi run -e s3-e2e test-boto3-e2e
    - name: Run Iceberg client acceptance
      run: pixi run clean-env && pixi run -e iceberg-e2e test-pyiceberg-e2e
    - name: Run console acceptance
      run: pixi run clean-env && pixi run test-console
    - name: Require installed system browser
      run: |
        pixi run bash -euc '
          for browser in /snap/bin/chromium /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/microsoft-edge; do
            [[ ! -x "$browser" ]] || exit 0
          done
          echo "Release runner requires an installed system browser" >&2
          exit 1
        '
    - name: Run console UI acceptance
      run: pixi run clean-env && pixi run test-console-ui
    - name: Check Rust formatting and lint
      run: pixi run rs-fmt-check && pixi run rs-lint
    - name: Verify exact-build source-line symbols
      if: inputs.include_symbols
      run: pixi run -- python tools/ci-checks/check-container-symbols.py
    - name: Archive verified runtime files
      run: pixi run tar -C target/container-runtime -czf target/container-runtime.tar.gz .
    - name: Archive exact-build symbols
      if: inputs.include_symbols
      run: pixi run tar -C target/container-symbols -I zstd -cf "target/crowdb-symbols-${{ inputs.tag }}-git-${{ steps.source.outputs.revision }}-linux-amd64.tar.zst" .
    - uses: actions/upload-artifact@v4
      with:
        name: verified-container-runtime
        path: target/container-runtime.tar.gz
        compression-level: 0
        retention-days: 7
    - uses: actions/upload-artifact@v4
      id: symbols_artifact
      if: inputs.include_symbols
      continue-on-error: true
      with:
        name: verified-container-symbols
        path: target/crowdb-symbols-*.tar.zst
        compression-level: 0
        retention-days: 7
    - name: Upload preview failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: release-preview-${{ github.run_attempt }}
        path: ${{ runner.temp }}/crowdb-preview-artifacts
        if-no-files-found: ignore
        retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: DockerHub
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Require publication credentials and unused immutable tags
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        REVISION: ${{ needs.verify.outputs.revision }}
        DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        pixi run bash -euc '
          [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]
          [[ "$(git rev-parse HEAD)" == "$REVISION" ]]
          for tag in "$RELEASE_TAG" "git-$REVISION"; do
            status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
              "https://hub.docker.com/v2/namespaces/crowdb/repositories/crowdb-iceberg/tags/$tag")
            [[ "$status" == 404 ]] || { echo "Immutable tag $tag is present or registry unavailable (HTTP $status)" >&2; exit 1; }
          done
        '
    - uses: docker/setup-buildx-action@v4
    - uses: actions/download-artifact@v4
      with:
        name: verified-container-runtime
        path: target
    - uses: actions/download-artifact@v4
      id: symbols_download
      if: inputs.include_symbols
      continue-on-error: true
      with:
        name: verified-container-symbols
        path: target
    - name: Extract verified runtime files
      run: |
        pixi run bash -euc 'mkdir -p target/container-runtime && tar -C target/container-runtime -xzf target/container-runtime.tar.gz'
        pixi run rm target/container-runtime.tar.gz
    - uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and publish signed-source image with attestations
      id: build
      uses: docker/build-push-action@v7
      with:
        context: target/container-runtime
        file: container/single-node-container/Dockerfile
        platforms: linux/amd64
        push: true
        provenance: mode=max
        sbom: true
        build-args: |
          SOURCE_REVISION=${{ needs.verify.outputs.revision }}
          PREVIEW_VERSION=${{ needs.verify.outputs.version }}
        tags: |
          docker.io/crowdb/crowdb-iceberg:${{ inputs.tag }}
          docker.io/crowdb/crowdb-iceberg:git-${{ needs.verify.outputs.revision }}
    - uses: sigstore/cosign-installer@v4.1.2
    - name: Sign published digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: pixi run cosign sign --yes "docker.io/crowdb/crowdb-iceberg@$DIGEST"
    - name: Publish verified GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: pixi run gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
    - name: Attach exact-build symbols to GitHub Release
      id: symbol_upload
      if: inputs.include_symbols && steps.symbols_download.outcome == 'success'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
        REVISION: ${{ needs.verify.outputs.revision }}
      run: pixi run gh release upload "$RELEASE_TAG" "target/crowdb-symbols-$RELEASE_TAG-git-$REVISION-linux-amd64.tar.zst" --repo "$GITHUB_REPOSITORY"
    - name: Report optional symbol upload failure
      if: inputs.include_symbols && (steps.symbols_download.outcome == 'failure' || steps.symbol_upload.outcome == 'failure')
      run: echo '::warning::The image and release were published, but the optional symbol archive could not be uploaded.'
