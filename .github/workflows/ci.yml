name: CI

on:
  push:
    branches: [ "main", "release/**", "codex/deploy" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 1
  CROWDB_E2E_PRINT_SERVICE_ERRORS: "1"

# Lint, component tests and release compilation start independently.
# Container domains consume one image and one set of host clients.
jobs:
  Lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - name: Cache compilation
      uses: ./.github/actions/compilation-cache
    - name: Check formatting
      run: pixi run cargo fmt --all -- --check
    - name: Check CI test tasks
      run: pixi run check-ci-test-tasks
    - name: Run clippy
      run: pixi run cargo clippy --all-targets -- -D warnings

  CppTests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - name: Cache compilation
      uses: ./.github/actions/compilation-cache
    - name: Clean env
      run: pixi run clean --runtime-only
    - name: Run C++ and FFI tests
      run: pixi run test-cpp
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-cpp-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7

  UnitTests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - name: Cache compilation
      uses: ./.github/actions/compilation-cache
    - name: Clean env
      run: pixi run clean --runtime-only
    - name: Run core component tests
      run: pixi run test-core
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-unit-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7

  StorageTests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - name: Cache compilation
      uses: ./.github/actions/compilation-cache
    - name: Clean env
      run: pixi run clean --runtime-only
    - name: Run storage component tests
      run: pixi run test-storage
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-storage-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean --runtime-only

  AccessTests:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - uses: ./.github/actions/compilation-cache
    - name: Clean env
      run: pixi run clean --runtime-only
    - name: Run access component tests
      run: |
        pixi run test-access
        pixi run test-access-sdk
    - name: Check standalone Dataset SDK
      run: |
        pixi run check-dataset-sdk-boundary
        pixi run sdk-fmt-check
        pixi run sdk-lint
        pixi run test-dataset-sdk
        pixi run test-dataset-sdk-python
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-access-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean --runtime-only

  S3E2E:
    env:
      CROWDB_COMPILED_TESTS: ${{ github.workspace }}/target/compiled-tests
      CROWDB_E2E_NODE_CPUS: "1"
      CROWDB_E2E_CPUS: "4"
      CROWDB_E2E_MEMORY_MIB: "8192"
    needs: [ContainerImage, BuildClients]
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - uses: ./.github/actions/restore-compiled
      with:
        artifact: ${{ needs.BuildClients.outputs.artifact }}
        kind: clients
    - name: Clean env
      run: pixi run clean --runtime-only
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.ContainerImage.outputs.artifact }}
        path: target
    - name: Import shared release image
      run: pixi run --manifest-path container/oci-image/pixi.toml import "$PWD/target/crowdb.oci.tar" --image crowdb-node:dev
    - name: Run complete S3 acceptance
      run: pixi run test-e2e-s3
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Export bounded failure diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output "${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}"
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-s3-e2e-${{ github.run_attempt }}
        path: ${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean --runtime-only

  IcebergE2E:
    strategy:
      fail-fast: false
      matrix:
        partition: [iceberg-core, iceberg-gc-convergence, iceberg-gc-cleanup, iceberg-sdk, iceberg-grace]
    env:
      CROWDB_COMPILED_TESTS: ${{ github.workspace }}/target/compiled-tests
      CROWDB_E2E_NODE_CPUS: "1"
      CROWDB_E2E_CPUS: "4"
      CROWDB_E2E_MEMORY_MIB: "12288"
    needs: [ContainerImage, BuildClients]
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - uses: ./.github/actions/restore-compiled
      with:
        artifact: ${{ needs.BuildClients.outputs.artifact }}
        kind: clients
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.ContainerImage.outputs.artifact }}
        path: target
    - name: Import shared release image
      run: pixi run --manifest-path container/oci-image/pixi.toml import "$PWD/target/crowdb.oci.tar" --image crowdb-node:dev
    - name: Run Iceberg acceptance
      env:
        E2E_PARTITION: ${{ matrix.partition }}
      run: pixi run test-e2e-iceberg --partition "$E2E_PARTITION"
    - name: Export bounded failure diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output "${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}"
    - name: Upload Iceberg measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-${{ matrix.partition }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean --runtime-only

  ConsoleTests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - name: Cache compilation
      uses: ./.github/actions/compilation-cache
    - name: Clean env
      run: pixi run clean --runtime-only
    - name: Run console tests
      run: pixi run test-console
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-console-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean --runtime-only

  UITests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - name: Run UI component tests and types
      run: pixi run test-console-ui
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-ui-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean --runtime-only

  BuildClients:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact: compiled-clients-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - name: Free disk space
      run: |
        pixi run sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        pixi run sudo apt-get clean
        pixi run df -h /
    - name: Install compilation prerequisites
      run: |
        pixi run sudo apt-get update
        pixi run sudo apt-get install -y protobuf-compiler
    - name: Cache compilation
      uses: ./.github/actions/compilation-cache
    - name: Compile shared host clients
      run: pixi run python tools/ci-build/build.py clients
    - uses: actions/upload-artifact@v4
      with:
        name: compiled-clients-${{ github.run_attempt }}
        path: target/ci-build/clients.tar.gz
        compression-level: 0
        retention-days: 7

  ContainerImage:
    env:
      CROWDB_KEEP_DEBUG_INFO: ${{ vars.CROWDB_KEEP_DEBUG_INFO || '0' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact: verified-oci-image-${{ github.run_attempt }}
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      digest: ${{ steps.artifact.outputs.digest }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - name: Validate release source
      id: source
      run: |
        pixi run bash -euc '
          [[ "$GITHUB_REPOSITORY" == buzzcrow/crowdb ]]
          version=$(cat VERSION)
          revision=$(git rev-parse HEAD)
          [[ "$revision" == "$GITHUB_SHA" ]]
          printf "version=%s\nrevision=%s\n" "$version" "$revision" >> "$GITHUB_OUTPUT"
        '
    - name: Install compilation prerequisites and remove Docker
      run: pixi run python container/oci-image/prepare-ci-host.py
    - name: Free disk space
      run: |
        pixi run sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        pixi run sudo apt-get clean
        pixi run df -h /
    - name: Cache production compilation
      uses: ./.github/actions/compilation-cache
      with:
        key: BuildRuntime
    - name: Compile and stage production runtime
      run: pixi run bash container/oci-image/stage.sh
    - name: Install locked standalone builder
      run: pixi install --locked --manifest-path container/oci-image/pixi.toml
    - name: Build OCI without Docker
      run: |
        pixi run sudo "$(command -v pixi)" run --as-is --manifest-path container/oci-image/pixi.toml build --privileged --context "$PWD/target/container-runtime" --output "$PWD/target/crowdb.oci.tar"
        pixi run test-oci-image
    - name: Record constructed digest
      id: artifact
      run: pixi run python container/oci-image/ci-receipt.py target/crowdb.oci.tar
    - uses: actions/upload-artifact@v4
      with:
        name: verified-oci-image-${{ github.run_attempt }}
        path: |
          target/crowdb.oci.tar
          target/crowdb.oci.tar.json
        compression-level: 0
        retention-days: 7

  ContainerKV:
    env:
      CROWDB_COMPILED_TESTS: ${{ github.workspace }}/target/compiled-tests
    needs: [ContainerImage, BuildClients]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - uses: ./.github/actions/restore-compiled
      with:
        artifact: ${{ needs.BuildClients.outputs.artifact }}
        kind: clients
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.ContainerImage.outputs.artifact }}
        path: target
    - name: Import the shared verified image
      run: pixi run --manifest-path container/oci-image/pixi.toml import "$PWD/target/crowdb.oci.tar" --image crowdb-node:dev
    - name: Verify centralized KV fixtures and protocol layer
      run: |
        pixi run test-container-e2e-fixture
        pixi run clean --runtime-only
        pixi run test-e2e-kv
    - name: Record KV verified digest
      id: artifact
      run: pixi run python container/oci-image/ci-receipt.py target/crowdb.oci.tar
    - name: Export bounded failure diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output "${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kv-container-e2e-diagnostics
        path: ${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}/
        if-no-files-found: error

  ContainerConsole:
    strategy:
      fail-fast: false
      matrix:
        partition: [console-api, console-browser, console-native-data, console-native-operations, console-transition, console-inspection]
    env:
      CROWDB_COMPILED_TESTS: ${{ github.workspace }}/target/compiled-tests
    needs: [ContainerImage, BuildClients]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - uses: ./.github/actions/restore-compiled
      with:
        artifact: ${{ needs.BuildClients.outputs.artifact }}
        kind: clients
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.ContainerImage.outputs.artifact }}
        path: target
    - name: Import formal release image
      run: pixi run --manifest-path container/oci-image/pixi.toml import target/crowdb.oci.tar --image crowdb-node:dev
    - name: Verify installed system browser
      run: |
        for b in /snap/bin/chromium /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/microsoft-edge; do
          [ -x "$b" ] && { echo "System browser found at $b."; exit 0; }
        done
        echo "::error::Console E2E requires an installed system Chromium, Chrome or Edge."
        exit 1
    - name: Run Console, CLI and host browser flows
      env:
        E2E_PARTITION: ${{ matrix.partition }}
      run: pixi run test-e2e-console --partition "$E2E_PARTITION"
    - name: Export bounded failure diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output "${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}"
    - name: Upload measured flows and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: container-${{ matrix.partition }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  ContainerStorage:
    env:
      CROWDB_COMPILED_TESTS: ${{ github.workspace }}/target/compiled-tests
    needs: [ContainerImage, BuildClients]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
        - group: disk
          domains: diskdb diskio
        - group: chunk
          domains: chunkdb chunk-kv chunk-stream chunk-client
        - group: dataset
          domains: dataset
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - uses: ./.github/actions/restore-compiled
      with:
        artifact: ${{ needs.BuildClients.outputs.artifact }}
        kind: clients
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.ContainerImage.outputs.artifact }}
        path: target
    - name: Import shared release image
      run: pixi run --manifest-path container/oci-image/pixi.toml import "$PWD/target/crowdb.oci.tar" --image crowdb-node:dev
    - name: Verify container domain
      env:
        E2E_DOMAINS: ${{ matrix.domains }}
        CROWDB_E2E_CPUS: "4"
        CROWDB_E2E_MEMORY_MIB: "8192"
      run: |
        set -e
        for domain in $E2E_DOMAINS; do
          pixi run "test-e2e-$domain"
        done
    - name: Export bounded failure diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output "${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: container-${{ matrix.group }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  ContainerDeployment:
    env:
      CROWDB_COMPILED_TESTS: ${{ github.workspace }}/target/compiled-tests
    needs: [ContainerImage, BuildClients]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: [deployment-reference, deployment-services]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - uses: ./.github/actions/restore-compiled
      with:
        artifact: ${{ needs.BuildClients.outputs.artifact }}
        kind: clients
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.ContainerImage.outputs.artifact }}
        path: target
    - name: Import shared release image
      run: pixi run --manifest-path container/oci-image/pixi.toml import "$PWD/target/crowdb.oci.tar" --image crowdb-node:dev
    - name: Verify deployment acceptance
      env:
        E2E_PARTITION: ${{ matrix.partition }}
        CROWDB_E2E_CPUS: "4"
        CROWDB_E2E_MEMORY_MIB: "8192"
      run: pixi run test-e2e-deployment --partition "$E2E_PARTITION"
    - name: Export bounded failure diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output "${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: container-${{ matrix.partition }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/container-e2e-public-${{ github.run_id }}-${{ github.run_attempt }}/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
