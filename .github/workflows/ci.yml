name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 1

# 10 parallel jobs. See doc/working/test.md § "Current CI Test Design"
# for the assignment rule and how to add new test tasks.
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: pixi run cargo fmt --all -- --check
    - name: Check test-task coverage
      run: pixi run test-task-coverage
    - name: Run clippy
      run: pixi run cargo clippy --all-targets -- -D warnings

  CppTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Build C++ libs
      run: pixi run build-cpp
    - name: Run C++ and FFI tests
      run: pixi run test-cpp
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-cpp-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/
        if-no-files-found: ignore
        retention-days: 7

  UnitTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Run unit tests
      run: pixi run test-unit
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-unit-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/
        if-no-files-found: ignore
        retention-days: 7

  ServerTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Build C++ libs (crowdb-diskio subprocess)
      run: pixi run build-cpp
    - name: Run server tests
      run: pixi run test-server
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-server-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  S3E2E:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Run real-storage boto3 S3 E2E
      run: pixi run -e s3-e2e test-boto3-e2e
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-s3-e2e-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  IcebergE2E:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - uses: Swatinem/rust-cache@v2
    - name: Run Iceberg acceptance
      run: pixi run -e iceberg-e2e test-iceberg-e2e
    - name: Upload Iceberg failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-iceberge2e-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/
          target/iceberg-rck/open-api/build/reports/tests/
          target/iceberg-rck/open-api/build/test-results/
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  IcebergSDK:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - uses: Swatinem/rust-cache@v2
    - name: Run Iceberg acceptance
      run: pixi run -e iceberg-e2e test-iceberg-sdk
    - name: Upload Iceberg failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-icebergsdk-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/
          target/iceberg-rck/open-api/build/reports/tests/
          target/iceberg-rck/open-api/build/test-results/
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  ConsoleTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Build crowdb-rpc-fb-server (for bench rpc e2e test)
      run: pixi run cmake -S lib/crowdb-rpc -B lib/crowdb-rpc/build -DCMAKE_BUILD_TYPE=Release && pixi run cmake --build lib/crowdb-rpc/build --target crowdb-rpc-fb-server -j
    - name: Run console tests
      run: pixi run test-console
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-console-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  UITests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Install Playwright Chromium (skip if system browser present)
      working-directory: app/crowdb-web/ui
      run: |
        for b in /snap/bin/chromium /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/microsoft-edge; do
          [ -x "$b" ] && { echo "System browser found at $b; skipping download."; exit 0; }
        done
        pixi run npx playwright install --with-deps chromium
    - name: Run real-backend E2E suite
      run: pixi run test-console-ui
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-ui-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          app/crowdb-web/ui/playwright-report
          app/crowdb-web/ui/test-results
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  DockerPreview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Build and test single-node preview image
      env:
        CROWDB_PREVIEW_TEST_ARTIFACTS: ${{ runner.temp }}/crowdb-preview-artifacts
      run: pixi run test-single-node-container
    - name: Capture Docker diagnostics on failure
      if: failure()
      run: |
        docker ps -a
        docker images
        docker info
        df -h
    - name: Upload preview failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: docker-preview-${{ github.run_attempt }}
        path: ${{ runner.temp }}/crowdb-preview-artifacts
        if-no-files-found: ignore
        retention-days: 7
