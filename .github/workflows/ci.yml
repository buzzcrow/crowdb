name: CI

on:
  push:
    branches: [ "main", "release/**", "codex/deploy" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 1

# Component gates and independent container domains share one release image.
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: pixi run cargo fmt --all -- --check
    - name: Check CI test tasks
      run: pixi run check-ci-test-tasks
    - name: Run clippy
      run: pixi run cargo clippy --all-targets -- -D warnings

  CppTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Build C++ libs
      run: pixi run build-cpp
    - name: Run C++ and FFI tests
      run: pixi run test-cpp
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-cpp-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7

  UnitTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Run core component tests
      run: pixi run test-core
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-unit-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7

  StorageTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Build C++ libs (crowdb-diskio subprocess)
      run: pixi run build-cpp
    - name: Run storage component tests
      run: pixi run test-storage
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-storage-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  AccessTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Run access component tests
      run: pixi run test-access
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-access-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  S3E2E:
    env:
      CROWDB_E2E_NODE_CPUS: "0.2"
      CROWDB_E2E_CPUS: "4"
      CROWDB_E2E_MEMORY_MIB: "8192"
    needs: ContainerImage
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - uses: actions/download-artifact@v4
      with:
        name: verified-oci-image
        path: target
    - name: Import shared release image
      run: pixi run image-import "$PWD/target/crowdb.oci.tar" --image crowdb-node:dev
    - name: Run real-storage boto3 S3 E2E
      run: pixi run -e s3-e2e test-boto3-e2e
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Export redacted container diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output target/container-e2e-public
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-s3-e2e-${{ github.run_attempt }}
        path: target/container-e2e-public/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  IcebergE2E:
    env:
      CROWDB_E2E_NODE_CPUS: "0.25"
      CROWDB_E2E_CPUS: "4"
      CROWDB_E2E_MEMORY_MIB: "12288"
    needs: ContainerImage
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - uses: Swatinem/rust-cache@v2
    - uses: actions/download-artifact@v4
      with:
        name: verified-oci-image
        path: target
    - name: Import shared release image
      run: pixi run image-import "$PWD/target/crowdb.oci.tar" --image crowdb-node:dev
    - name: Run Iceberg acceptance
      run: pixi run test-container-e2e --layer iceberg --concurrency 2 --node-cpus 0.25 --cpus 4 --memory-mib 12288
    - name: Export redacted container diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output target/container-e2e-public
    - name: Upload Iceberg measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-iceberge2e-${{ github.run_attempt }}
        path: target/container-e2e-public/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  IcebergSDK:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - uses: Swatinem/rust-cache@v2
    - name: Run Iceberg component SDK proofs
      run: pixi run -e iceberg-e2e test-iceberg-sdk-component
    - name: Upload Iceberg measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-icebergsdk-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
          ${{ runner.temp }}/iceberg-rck/open-api/build/reports/tests/
          ${{ runner.temp }}/iceberg-rck/open-api/build/test-results/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  ConsoleTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Run console tests
      run: pixi run test-console
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-console-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
          app/crowdb-web/ui/e2e/test-results/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  UITests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Verify installed system browser
      working-directory: app/crowdb-web/ui
      run: |
        for b in /snap/bin/chromium /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/microsoft-edge; do
          [ -x "$b" ] && { echo "System browser found at $b."; exit 0; }
        done
        echo "::error::Console E2E requires an installed system Chromium, Chrome or Edge."
        exit 1
    - name: Run real-backend E2E suite
      run: pixi run test-console-ui
    - name: Capture runner state on failure
      if: failure()
      run: |
        echo "=== Listening ports ==="
        ss -tlnp 2>/dev/null || true
        echo "=== Process list (crowdb) ==="
        ps aux | grep -E 'crowdb|cargo' | grep -v grep || true
        echo "=== Disk space ==="
        df -h
        echo "=== CROWDB runtime files ==="
        find .crowdb-runtime -maxdepth 4 -type f -print 2>/dev/null || true
    - name: Upload S3 measurements and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-ui-${{ github.run_attempt }}
        path: |
          .crowdb-runtime/**/log/**
          .crowdb-runtime/**/*.log
          .crowdb-runtime/**/*.log.*
          .crowdb-runtime/**/*.out
          .crowdb-runtime/**/*.toml
          .crowdb-runtime/**/*.json
          .crowdb-runtime/**/*.png
          .crowdb-runtime/**/*.md
          .crowdb-runtime/**/*.html
          .crowdb-runtime/**/trace.zip
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          app/crowdb-web/ui/playwright-report
          app/crowdb-web/ui/test-results
          app/crowdb-web/ui/e2e/test-results
        retention-days: 7
    - name: Clean subprocesses
      if: always()
      run: pixi run clean-env

  ContainerImage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      digest: ${{ steps.artifact.outputs.digest }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - name: Validate release source
      id: source
      run: |
        pixi run bash -euc '
          [[ "$GITHUB_REPOSITORY" == buzzcrow/crowdb ]]
          version=$(cat VERSION)
          revision=$(git rev-parse HEAD)
          [[ "$revision" == "$GITHUB_SHA" ]]
          printf "version=%s\nrevision=%s\n" "$version" "$revision" >> "$GITHUB_OUTPUT"
        '
    - name: Install compilation prerequisites and remove Docker
      run: |
        pixi run sudo apt-get update
        pixi run sudo apt-get install -y protobuf-compiler
        pixi run sudo systemctl stop docker.service docker.socket containerd.service
        pixi run sudo apt-get purge -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        pixi run bash -euc '! command -v docker; test ! -S /var/run/docker.sock'
    - name: Free disk space
      run: |
        pixi run sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        pixi run sudo apt-get clean
        pixi run df -h /
    - name: Stage runtime without a container daemon
      run: pixi run env CROWDB_KEEP_DEBUG_INFO=1 bash container/oci-image/stage.sh
    - name: Install locked standalone builder
      run: pixi install --locked --manifest-path container/oci-image/pixi.toml
    - name: Build OCI without Docker
      run: |
        pixi run sudo "$(command -v pixi)" run --as-is --manifest-path container/oci-image/pixi.toml build --privileged --context "$PWD/target/container-runtime" --output "$PWD/target/crowdb.oci.tar"
        pixi run test-oci-image
    - name: Record constructed digest
      id: artifact
      run: pixi run python container/oci-image/ci-receipt.py target/crowdb.oci.tar
    - uses: actions/upload-artifact@v4
      with:
        name: verified-oci-image
        path: |
          target/crowdb.oci.tar
          target/crowdb.oci.tar.json
        compression-level: 0
        retention-days: 7

  ContainerKV:
    needs: ContainerImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.artifact.outputs.digest }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - uses: actions/download-artifact@v4
      with:
        name: verified-oci-image
        path: target
    - name: Install client compilation prerequisites
      run: |
        pixi run sudo apt-get update
        pixi run sudo apt-get install -y protobuf-compiler
    - name: Import the shared verified image
      run: pixi run image-import "$PWD/target/crowdb.oci.tar" --image crowdb-node:dev
    - name: Verify centralized KV fixtures and protocol layer
      run: |
        pixi run test-container-e2e-fixture
        pixi run clean-env
        pixi run test-container-e2e --layer kv --concurrency 2 --require-isolation --cpus 4 --memory-mib 4096
    - name: Record KV verified digest
      id: artifact
      run: pixi run python container/oci-image/ci-receipt.py target/crowdb.oci.tar
    - name: Export redacted container diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output target/container-e2e-public
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kv-container-e2e-diagnostics
        path: target/container-e2e-public/
        if-no-files-found: error

  ContainerConsole:
    needs: ContainerImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - name: Install client compilation prerequisites
      run: |
        pixi run sudo apt-get update
        pixi run sudo apt-get install -y protobuf-compiler
    - uses: Swatinem/rust-cache@v2
    - uses: actions/download-artifact@v4
      with:
        name: verified-oci-image
        path: target
    - name: Import formal release image
      run: pixi run image-import target/crowdb.oci.tar --image crowdb-node:dev
    - name: Run Console, CLI and host browser flows
      run: pixi run test-container-e2e --scope console.operations --concurrency 2 --node-cpus 0.25 --cpus 8 --memory-mib 16384
    - name: Export redacted container diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output target/container-e2e-public
    - name: Upload measured flows and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: container-console-operations-${{ github.run_attempt }}
        path: target/container-e2e-public/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  ContainerStorage:
    needs: ContainerImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        layer: [diskdb, diskio, chunkdb, chunk-stream, chunk-client, chunk-kv, dataset, deployment]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.ContainerImage.outputs.revision }}
        submodules: true
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.77.0
    - uses: actions/download-artifact@v4
      with:
        name: verified-oci-image
        path: target
    - name: Install client compilation prerequisites
      run: |
        pixi run sudo apt-get update
        pixi run sudo apt-get install -y protobuf-compiler
    - name: Import shared release image
      run: pixi run image-import "$PWD/target/crowdb.oci.tar" --image crowdb-node:dev
    - name: Verify container domain
      run: pixi run test-container-e2e --layer "${{ matrix.layer }}" --concurrency 2 --node-cpus 0.25 --cpus 4 --memory-mib 8192
    - name: Export redacted container diagnostics
      if: always()
      run: pixi run python e2e-test/publish.py --source .crowdb-runtime/artifacts/container-e2e --output target/container-e2e-public
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: container-${{ matrix.layer }}-${{ github.run_attempt }}
        path: target/container-e2e-public/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
