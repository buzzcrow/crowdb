[workspace]
name = "crowdb-kv"
version = "0.3.0"
description = "CROWDB — distributed key-value store with multi-paxos groups"
channels = ["conda-forge"]
# Keep glibc requirement low (2.17 = CentOS 7 / Ubuntu 16.04 era) so that
# Linux binaries built in this environment run on older distributions.
# conda-forge packages are built against glibc 2.17 by default.
platforms = [
  "osx-arm64",
  "linux-64",
]

[dependencies]
# C++ build toolchain (lib/crowdb-tree)
cmake = ">=3.20"
make = "*"
cxx-compiler = "*"
gtest = "*"
lz4 = "*"
libabseil = "*"  # lib/crowdb-tree MemTable uses absl::btree_map (plan-tree #9)
spdlog = ">=1.17.0,<2"  # lib/crowdb-tree async file logging (plan-tree #10)
clang-format = ">=19.0.0"
clang-tools = "*"
# clang-tidy (from clang-tools) needs the clang builtin resource headers
# (stddef.h, stdarg.h, ...) under lib/clang/<ver>/include/. clang-tools ships
# only the tools, not those headers (conda-forge/clangdev-feedstock#87), so
# clang-tidy fails with "'stddef.h' file not found" on the conda sysroot.
# clang-23 pulls in compiler-rt23, which installs the resource-dir headers.
# Pinned to 23.1.0 to match the locked clang-tools; the resource dir is keyed
# by major version (23), so any 23.1.x is compatible. This does NOT change the
# C++ build compiler: cxx-compiler activates the conda gcc/g++, and no clang
# activation script overrides CC/CXX, so cmake keeps using GNU.
clang-23 = "==23.1.0"
folly = "*"
isa-l = "*"
# Flatbuffer schema compiler + runtime headers for crowdb-rpc (R104) and
# crowdb-protocol's .fbs codegen. Provides `flatc` and flatbuffers/cpp headers.
flatbuffers = "*"
tomlplusplus = ">=3.3.0,<4"
# Rust toolchain (crowdb-kv)
rust = ">=1.96"
openssl = "*"
pkg-config = "*"
# Frontend
nodejs = ">=22,<23"
# Tools
git = "*"
jq = "*"
tokei = "*"
benchmark = ">=1.9.5,<2"
zlib = ">=1.3.2,<2"
xz = ">=5.8.3,<6"
zstd = ">=1.5.7,<2"
bzip2 = ">=1.0.8,<2"
snappy = ">=1.2.2,<2"

# io_uring reactor (lib/crowdb-tree/include/lib/crowdb-tree/reactor.h).
# Linux-only kernel interface -- no osx-arm64 conda-forge build exists, so this
# must be a per-platform target dependency, not a top-level one (design doc
# design/tree/design-crowdb-tree-engine.md §3.5: the reactor itself is excluded from macOS
# builds; see lib/crowdb-tree/CMakeLists.txt's CROWDB_TREE_HAVE_LIBURING gate).
[target.linux-64.dependencies]
liburing = "*"
# RDMA transport for crowdb-rpc (R104 Phase 5), gated behind
# CROWDB_RPC_HAVE_RDMA in lib/crowdb-rpc/CMakeLists.txt. No macOS RNICs, so
# these stay Linux-only (mirrors the liburing per-platform pattern).
# rdma-core provides both libibverbs and librdmacm.
rdma-core = "*"
patchelf = ">=0.19.1,<0.20"

[feature.s3-e2e.dependencies]
boto3 = "==1.43.92"
awscli = "==2.36.47"
rclone = "==1.75.1"

[environments]
s3-e2e = { features = ["s3-e2e"], no-default-feature = true }
iceberg-e2e = { features = ["iceberg-e2e"], no-default-feature = true }
iceberg-ecosystem = { features = ["iceberg-ecosystem"], no-default-feature = true }
s3-java-sdk = { features = ["s3-java-sdk"], no-default-feature = true }
s3-js-sdk = { features = ["s3-js-sdk"], no-default-feature = true }
s3-go-sdk = { features = ["s3-go-sdk"], no-default-feature = true }

[feature.s3-go-sdk.dependencies]
go = "1.25.*"

[feature.s3-go-sdk.activation.env]
GOTOOLCHAIN = "local"
CGO_ENABLED = "0"

[feature.s3-js-sdk.dependencies]
nodejs = "22.*"

[feature.s3-java-sdk.dependencies]
openjdk = "21.*"
maven = "3.9.*"

[feature.iceberg-e2e.dependencies]
python = "3.12.*"
pyiceberg = ">=0.10,<0.12"
pyarrow = "*"
pandas = "*"
s3fs = "*"
openjdk = "21.*"
maven = "3.9.*"

# Explicit manual client/engine acceptance; never a default test dependency.
[feature.iceberg-ecosystem.dependencies]
python = "3.12.*"
pyiceberg = "==0.11.1"
pyarrow = "==25.0.0"
pandas = "==3.0.6"
polars = "==1.35.2"
duckdb = "==1.4.3"
openjdk = "17.*"
maven = "3.9.*"

[pypi-dependencies]
maturin = ">=1.15, <2"
pip = ">=25, <27"
auditwheel = ">=6, <7"

[tasks]

################################################################################
# Build — install dependencies, clean outputs and compile
################################################################################
install-deps = { cmd = "bash tools/pixi-tasks/install-deps.sh" }
# Frontend dependencies only; avoids installing profiling tools for UI tests.
install-ui-deps = "test -d app/crowdb-web/ui/node_modules || (cd app/crowdb-web/ui && npm ci)"
# Remove build products and the complete workspace runtime tree.
clean = { cmd = "bash tools/pixi-tasks/clean-build.sh" }
# Stop recorded ephemeral processes and remove disposable runtime state.
clean-env = "bash tools/pixi-tasks/clean-env.sh"
# Standalone C++ libraries for ctest; Rust FFI builds its own C++ libraries.
build-cpp = { cmd = "bash tools/pixi-tasks/build-cpp.sh" }
# Full release build: C++ libraries, Rust binaries and frontend.
build = { cmd = "bash tools/pixi-tasks/build-release.sh", depends-on = ["build-cpp", "install-ui-deps"] }
# Optional compile-only check for all workspace test targets.
build-tests = "cargo test --workspace --all-targets --no-run"
default = { depends-on = ["build"] }

################################################################################
# Test — component, SDK and container acceptance suites
################################################################################
test = "python tools/pixi-tasks/test.py"
test-suite = { cmd = "python tools/pixi-tasks/test.py all", depends-on = ["build-cpp", "install-ui-deps"] }
test-cpp = { cmd = "python tools/pixi-tasks/test.py unit cpp", depends-on = ["build-cpp"] }
test-core = { cmd = "python tools/pixi-tasks/test.py unit core" }
test-storage = { cmd = "python tools/pixi-tasks/test.py unit storage" }
test-access = { cmd = "python tools/pixi-tasks/test.py unit access" }
test-console = { cmd = "python tools/pixi-tasks/test.py unit console" }
test-console-ui = { cmd = "python tools/pixi-tasks/test.py unit ui", depends-on = ["install-ui-deps"] }
test-access-sdk = "python tools/pixi-tasks/test.py unit sdk"
test-dataset-sdk = "cargo test --release --manifest-path sdk/Cargo.toml --workspace --locked"
test-dataset-sdk-python = "python tools/sdk/package.py"
test-tree-link-isolation = "bash tools/cpp-checks/tree-link-isolation.sh"
test-e2e-kv = "python tools/pixi-tasks/test.py e2e kv"
test-e2e-diskdb = "python tools/pixi-tasks/test.py e2e diskdb"
test-e2e-diskio = "python tools/pixi-tasks/test.py e2e diskio"
test-e2e-chunkdb = "python tools/pixi-tasks/test.py e2e chunkdb"
test-e2e-chunk-stream = "python tools/pixi-tasks/test.py e2e chunk-stream"
test-e2e-chunk-client = "python tools/pixi-tasks/test.py e2e chunk-client"
test-e2e-chunk-kv = "python tools/pixi-tasks/test.py e2e chunk-kv"
test-e2e-s3 = "python tools/pixi-tasks/test.py e2e s3"
test-e2e-iceberg = "python tools/pixi-tasks/test.py e2e iceberg"
test-e2e-dataset = "python tools/pixi-tasks/test.py e2e dataset"
test-e2e-console = "python tools/pixi-tasks/test.py e2e console"
test-e2e-deployment = "python tools/pixi-tasks/test.py e2e deployment"
test-container-e2e = "python e2e-test/run.py"
test-container-e2e-fixture = "env PYTHONPATH=e2e-test python -m unittest discover -s e2e-test/tests -p '*_test.py' -v"
test-oci-image = "pixi run --manifest-path container/oci-image/pixi.toml test"
test-single-node-container = { cmd = "bash container/single-node-container/tests/release-policy.sh && bash container/single-node-container/tests/image-smoke.sh && bash container/single-node-container/tests/container-e2e.sh", depends-on = ["install-ui-deps"] }

################################################################################
# Tools — format, lint, architecture checks and source line counts
################################################################################
tree-fmt = '''
find lib/crowdb-tree/src lib/crowdb-tree/include lib/crowdb-tree/tests lib/crowdb-tree/bench lib/crowdb-common/cpp lib/crowdb-rpc/src lib/crowdb-rpc/include lib/crowdb-rpc/tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format -i
'''
rs-fmt = '''cargo metadata --format-version 1 --no-deps | jq -r '.workspace_members as $members | .packages[] | select(.id as $package_id | $members | index($package_id)) | .name' | xargs sh -c 'cargo fmt --package "$@"' _'''
rs-fmt-check = '''cargo metadata --format-version 1 --no-deps | jq -r '.workspace_members as $members | .packages[] | select(.id as $package_id | $members | index($package_id)) | .name' | xargs sh -c 'cargo fmt --package "$@" -- --check' _'''
sdk-fmt-check = "cargo fmt --manifest-path sdk/Cargo.toml --all -- --check"
# CPATH supplies conda headers omitted from GCC compile_commands.json.
tree-lint = "CPATH=$CONDA_PREFIX/include python3 tools/cpp-checks/clang-tidy.py"
rs-lint = { cmd = "cargo clippy --all-targets -- -D warnings", depends-on = ["check-production-dashmap", "check-version"] }
sdk-lint = "cargo clippy --release --manifest-path sdk/Cargo.toml --workspace --all-targets --locked -- -D warnings"
ts-lint = { cmd = "python tools/pixi-tasks/check-console-types.py", depends-on = ["install-ui-deps"] }
check-production-dashmap = "python3 tools/ci-checks/check-production-dashmap.py"
check-version = "python3 tools/ci-checks/check-version.py"
check-dataset-sdk-boundary = "python tools/ci-checks/check-dataset-sdk-boundary.py"
check-ci-test-tasks = "python tools/ci-checks/check-ci-test-tasks.py"
loc = "tokei . .github --exclude swagger-ui --exclude third-party --exclude 'lib/crowdb-tree/build-*' --exclude target --exclude dist --exclude node_modules --exclude package-lock.json"

################################################################################
# Tools — sanitizers, coverage and profiling
################################################################################
tree-asan = { cmd = "bash tools/pixi-tasks/tree-asan.sh" }
tree-tsan = { cmd = "bash tools/pixi-tasks/tree-tsan.sh" }
tree-ubsan = { cmd = "bash tools/pixi-tasks/tree-ubsan.sh" }
coverage = { cmd = "cargo tarpaulin --workspace --out Html --output-dir target/coverage --exclude-files '*/tests/*'", depends-on = ["install-deps"] }
profile-write = { cmd = "bash tools/profiling/profile-write.sh", depends-on = ["build"] }

################################################################################
# OCI containers — build once, run isolated clusters, stop or clean owned resources
################################################################################
# Build an OCI archive. Add --load to load crowdb-node:dev into local Docker.
oci-build = "bash container/oci-image/image-build.sh"
# Run uses the existing image; monitors discover peers and prepare the cluster.
oci-run = "python container/oci-image/docker-local.py run"
oci-run-1c = "python container/oci-image/docker-local.py run --nodes 1"
oci-run-3c = "python container/oci-image/docker-local.py run --nodes 3"
# Scope defaults to --cluster local. Global scope requires --all explicitly.
oci-stop = "python container/oci-image/docker-local.py stop"
# Remove owned containers and bridges; preserve data unless --delete-data is set.
oci-clean = "python container/oci-image/docker-local.py clean"
oci-host-clean = "python container/oci-image/host-clean.py"

################################################################################
# Test environments — isolated client dependencies; run with pixi run -e <name>
################################################################################
[feature.s3-e2e.tasks]
test-boto3-copy-error = { cmd = "python tools/pixi-tasks/test.py unit boto3" }

[feature.iceberg-ecosystem.tasks]
test-iceberg-container-ecosystem = "bash e2e-test/clients/ecosystem/run.sh"

