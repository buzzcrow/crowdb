[workspace]
name = "crowdb-kv"
version = "0.2.1"
description = "CROWDB — distributed key-value store with multi-paxos groups"
channels = ["conda-forge"]
# Keep glibc requirement low (2.17 = CentOS 7 / Ubuntu 16.04 era) so that
# Linux binaries built in this environment run on older distributions.
# conda-forge packages are built against glibc 2.17 by default.
platforms = [
  "osx-arm64",
  "linux-64",
]

[dependencies]
# C++ build toolchain (lib/crowdb-tree)
cmake = ">=3.20"
make = "*"
cxx-compiler = "*"
gtest = "*"
lz4 = "*"
libabseil = "*"  # lib/crowdb-tree MemTable uses absl::btree_map (plan-tree #9)
spdlog = ">=1.17.0,<2"  # lib/crowdb-tree async file logging (plan-tree #10)
clang-format = ">=19.0.0"
clang-tools = "*"
# clang-tidy (from clang-tools) needs the clang builtin resource headers
# (stddef.h, stdarg.h, ...) under lib/clang/<ver>/include/. clang-tools ships
# only the tools, not those headers (conda-forge/clangdev-feedstock#87), so
# clang-tidy fails with "'stddef.h' file not found" on the conda sysroot.
# clang-23 pulls in compiler-rt23, which installs the resource-dir headers.
# Pinned to 23.1.0 to match the locked clang-tools; the resource dir is keyed
# by major version (23), so any 23.1.x is compatible. This does NOT change the
# C++ build compiler: cxx-compiler activates the conda gcc/g++, and no clang
# activation script overrides CC/CXX, so cmake keeps using GNU.
clang-23 = "==23.1.0"
folly = "*"
isa-l = "*"
# Flatbuffer schema compiler + runtime headers for crowdb-rpc (R104) and
# crowdb-protocol's .fbs codegen. Provides `flatc` and flatbuffers/cpp headers.
flatbuffers = "*"
tomlplusplus = ">=3.3.0,<4"
# Rust toolchain (crowdb-kv)
rust = ">=1.96"
openssl = "*"
pkg-config = "*"
# Frontend
nodejs = ">=22,<23"
# Tools
git = "*"
jq = "*"
tokei = "*"
benchmark = ">=1.9.5,<2"
zlib = ">=1.3.2,<2"
xz = ">=5.8.3,<6"
zstd = ">=1.5.7,<2"
bzip2 = ">=1.0.8,<2"
snappy = ">=1.2.2,<2"

# io_uring reactor (lib/crowdb-tree/include/lib/crowdb-tree/reactor.h).
# Linux-only kernel interface -- no osx-arm64 conda-forge build exists, so this
# must be a per-platform target dependency, not a top-level one (design doc
# design/tree/design-crowdb-tree-engine.md §3.5: the reactor itself is excluded from macOS
# builds; see lib/crowdb-tree/CMakeLists.txt's CROWDB_TREE_HAVE_LIBURING gate).
[target.linux-64.dependencies]
liburing = "*"
# RDMA transport for crowdb-rpc (R104 Phase 5), gated behind
# CROWDB_RPC_HAVE_RDMA in lib/crowdb-rpc/CMakeLists.txt. No macOS RNICs, so
# these stay Linux-only (mirrors the liburing per-platform pattern).
# rdma-core provides both libibverbs and librdmacm.
rdma-core = "*"
patchelf = ">=0.19.1,<0.20"

[feature.s3-e2e.dependencies]
boto3 = "==1.43.92"
awscli = "==2.36.47"
rclone = "==1.75.1"

[feature.s3-e2e.tasks]
test-boto3-e2e = { cmd = "bash tools/pixi-tasks/test-s3-e2e.sh" }
test-aws-cli-e2e = "bash tools/pixi-tasks/test-s3-client.sh aws"
test-aws-cli-concurrent = "CROWDB_S3_CLIENT_CONCURRENCY=10 bash tools/pixi-tasks/test-s3-client.sh aws"
test-rclone-e2e = "bash tools/pixi-tasks/test-s3-client.sh rclone"

[environments]
s3-e2e = { features = ["s3-e2e"], no-default-feature = true }
iceberg-e2e = { features = ["iceberg-e2e"], no-default-feature = true }
iceberg-ecosystem = { features = ["iceberg-ecosystem"], no-default-feature = true }
s3-java-sdk = { features = ["s3-java-sdk"], no-default-feature = true }
s3-js-sdk = { features = ["s3-js-sdk"], no-default-feature = true }
s3-go-sdk = { features = ["s3-go-sdk"], no-default-feature = true }

[feature.s3-go-sdk.dependencies]
go = "1.25.*"

[feature.s3-go-sdk.activation.env]
GOTOOLCHAIN = "local"
CGO_ENABLED = "0"

[feature.s3-js-sdk.dependencies]
nodejs = "22.*"

[feature.s3-java-sdk.dependencies]
openjdk = "21.*"
maven = "3.9.*"

[feature.iceberg-e2e.dependencies]
python = "3.12.*"
pyiceberg = ">=0.10,<0.12"
pyarrow = "*"
pandas = "*"
s3fs = "*"
openjdk = "21.*"
maven = "3.9.*"

[feature.iceberg-e2e.tasks]
test-iceberg-listing-client = "bash tools/pixi-tasks/test-iceberg-listing-client.sh"
test-iceberg-listing-native = "bash tools/pixi-tasks/test-iceberg-listing-native.sh"
test-iceberg-native = "bash tools/pixi-tasks/test-iceberg-native.sh"
test-java-iceberg-e2e = "bash tools/pixi-tasks/test-java-iceberg-e2e.sh"
test-rust-iceberg-e2e = "bash tools/pixi-tasks/test-rust-iceberg-e2e.sh"
test-iceberg-rck = "bash tools/pixi-tasks/test-iceberg-rck.sh"
test-iceberg-e2e = "bash tools/pixi-tasks/test-iceberg-e2e.sh"
test-iceberg-sdk = "bash tools/pixi-tasks/test-iceberg-sdk.sh"
test-java-iceberg-fileio-e2e = { cmd = "bash tools/pixi-tasks/test-java-iceberg-fileio-e2e.sh" }
test-pyiceberg-e2e = { cmd = "bash tools/pixi-tasks/test-pyiceberg-e2e.sh" }

# Explicit manual client/engine acceptance; never a default test dependency.
[feature.iceberg-ecosystem.dependencies]
python = "3.12.*"
pyiceberg = "==0.11.1"
pyarrow = "==25.0.0"
pandas = "==3.0.6"
polars = "==1.35.2"
duckdb = "==1.4.3"
openjdk = "17.*"
maven = "3.9.*"

[feature.iceberg-ecosystem.tasks]
test-iceberg-container-ecosystem = "bash container/single-node-container/tests/ecosystem/run.sh"

[tasks]
test-s3-java-sdk = "bash tools/pixi-tasks/test-s3-sdk.sh java"
test-s3-js-sdk = "bash tools/pixi-tasks/test-s3-sdk.sh js"
test-s3-go-sdk = "bash tools/pixi-tasks/test-s3-sdk.sh go"
test-s3-sdks = "bash tools/pixi-tasks/test-s3-sdks.sh"

# ── Build ────────────────────────────────────────────────────────
# C++ libraries only (crowdb-tree, crowdb-rpc, crowdb-diskio). Needed by C++
# ctest tasks. Rust FFI crates compile their own C++ via cc::Build in
# build.rs, so Rust tests do NOT depend on this.
build-cpp = { cmd = "bash tools/pixi-tasks/build-cpp.sh" }
# npm deps only (for UI tests and ts-lint). Separated from install-deps
# so test-console-ui doesn't trigger cargo installs of profiling tools.
install-ui-deps = "test -d app/crowdb-web/ui/node_modules || (cd app/crowdb-web/ui && npm ci)"
install-deps = { cmd = "bash tools/pixi-tasks/install-deps.sh" }
tree-fmt = '''
find lib/crowdb-tree/src lib/crowdb-tree/include lib/crowdb-tree/tests lib/crowdb-tree/bench lib/crowdb-common/cpp lib/crowdb-rpc/src lib/crowdb-rpc/include lib/crowdb-rpc/tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format -i
'''
# CPATH lets clang-tidy find the conda env headers (spdlog, gtest, folly,
# absl, flatbuffers, zlib, isa-l, liburing, infiniband, ...) at
# $CONDA_PREFIX/include. The conda gcc has this as a built-in default include
# path, but clang-tidy (a separate compiler) does not, and compile_commands.json
# does not list it explicitly because gcc finds those headers automatically.
# clang treats CPATH entries as system includes, so warnings from third-party
# headers are suppressed.
tree-lint = "CPATH=$CONDA_PREFIX/include python3 tools/cpp-checks/clang-tidy.py"
test-tree-link-isolation = "bash tools/cpp-checks/tree-link-isolation.sh"
rs-fmt = '''cargo metadata --format-version 1 --no-deps | jq -r '.workspace_members as $members | .packages[] | select(.id as $package_id | $members | index($package_id)) | .name' | xargs sh -c 'cargo fmt --package "$@"' _'''
rs-fmt-check = '''cargo metadata --format-version 1 --no-deps | jq -r '.workspace_members as $members | .packages[] | select(.id as $package_id | $members | index($package_id)) | .name' | xargs sh -c 'cargo fmt --package "$@" -- --check' _'''
check-production-dashmap = "python3 tools/ci-checks/check-production-dashmap.py"
check-version = "python3 tools/ci-checks/check-version.py"
rs-lint = { cmd = "cargo clippy --all-targets -- -D warnings", depends-on = ["check-production-dashmap", "check-version"] }
ts-lint = { cmd = "cd app/crowdb-web/ui && npx tsc --noEmit --project tsconfig.e2e.json", depends-on = ["install-ui-deps"] }
# Full build: C++ libs + release Rust binaries + frontend. Used by
# run/bench/profile. Tests use build-cpp (C++ tests) or nothing (Rust tests).
build = { cmd = "bash tools/pixi-tasks/build-release.sh", depends-on = ["build-cpp", "install-ui-deps"] }
default = { depends-on = ["build"] }
stage-single-node-container = "bash container/single-node-container/build.sh stage"
build-single-node-container = "bash container/single-node-container/build.sh image"
test-single-node-container = { cmd = "bash container/single-node-container/tests/release-policy.sh && bash container/single-node-container/tests/image-smoke.sh && bash container/single-node-container/tests/container-e2e.sh", depends-on = ["build-single-node-container", "install-ui-deps"] }

# ── Run ──────────────────────────────────────────────────────────
web = { cmd = "echo 'CROWDB console starting at: http://127.0.0.1:9090/' && cargo run --release -p crowdb-web", depends-on = ["build"] }

# ── Benchmark ────────────────────────────────────────────────────
bench = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode mem --duration-secs 12 --loader-num 2 --connections 1 --workload write", depends-on = ["build"] }
bench-mem = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode mem --duration-secs 30", depends-on = ["build"] }
bench-file = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode file --duration-secs 30", depends-on = ["build"] }
bench-block = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode block --duration-secs 30", depends-on = ["build"] }
bench-burst = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode mem --duration-secs 10 --loader-num 64 --connections 8 --key-space 10000 --value-size 256 --workload mix", depends-on = ["build"] }
bench-soak = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode mem --duration-secs 30 --loader-num 8 --connections 4 --key-space 100000 --value-size 1024 --workload write", depends-on = ["build"] }
bench-hotread = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode mem --duration-secs 15 --loader-num 32 --connections 4 --key-space 64 --value-size 64 --workload read", depends-on = ["build"] }
bench-compare = { cmd = "cargo run --release -p crowdb-cli -- bench compare", depends-on = ["build"] }

# ── Profile ───────────────────────────────────────────────────────
profile-write = { cmd = "bash tools/profiling/profile-write.sh", depends-on = ["build"] }

# ── Test ─────────────────────────────────────────────────────────
# Tasks are grouped by CI job (see doc/working/test.md § "Current CI
# Test Design"). Each group maps 1:1 to a parallel CI job. Run
# Each test group builds only its own Rust targets. C++ ctest tasks need
# `pixi run build-cpp`.
clean-env = "bash tools/runtime/clean-runtime.sh env"
# Optional full-workspace compile check. CI test groups use their component
# tasks to avoid building unrelated test targets on each runner.
build-tests = "cargo test --workspace --all-targets --no-run"
# Verify every workspace package is assigned to a test task reachable from CI.
check-ci-test-tasks = "python tools/ci-checks/check-ci-test-tasks.py"

# ── Lint job ──
# (uses rs-fmt / rs-lint / tree-lint defined above, no separate test-* tasks)

# ── CppTests job: C++ ctest (needs build-cpp) + Rust FFI (cc::Build) ──
test-tree-ct = { cmd = "ctest --test-dir lib/crowdb-tree/build --output-on-failure", depends-on = ["build-cpp"] }
test-common-ct = { cmd = "lib/crowdb-tree/build/crowdb-common-build/crowdbcommon_tests", depends-on = ["build-cpp"] }
test-rpc-ct = { cmd = "ctest --test-dir lib/crowdb-rpc/build --output-on-failure", depends-on = ["build-cpp"] }
test-diskio-ct = { cmd = "ctest --test-dir app/crowdb-diskio/build --output-on-failure", depends-on = ["build-cpp"] }
test-tree-ffi = { cmd = "cargo test -p crowdb-tree-ffi --tests" }
test-rpc-ffi = { cmd = "cargo test -p crowdb-rpc-ffi --tests" }
test-cpp = { cmd = "bash tools/pixi-tasks/test-cpp.sh", depends-on = ["build-cpp"] }

# ── UnitTests job: pure Rust, no subprocess spawning ──
test-common = { cmd = "cargo test -p crowdb-common --tests" }
test-harness = { cmd = "cargo test -p crowdb-test-harness --tests" }
test-protocol = { cmd = "cargo test -p crowdb-protocol --tests" }
test-kv-core = { cmd = "cargo test -p crowdb-kv --tests" }
test-kv-client = { cmd = "cargo test -p crowdb-kv-client --tests" }
test-chunkdb-client = { cmd = "cargo test -p crowdb-chunkdb-client --tests" }
test-chunk-kv = { cmd = "cargo test -p crowdb-chunk-kv --tests" }
test-chunk-stream = { cmd = "cargo test -p crowdb-chunk-stream --tests" }
test-chunk-kv-client = { cmd = "cargo test -p crowdb-chunk-kv-client --tests" }
test-chunk-kv-server = { cmd = "cargo test -p crowdb-chunk-kv-server --tests" }
test-access-multipart = { cmd = "cargo test -p crowdb-access-multipart --tests" }
test-unit = { cmd = "bash tools/pixi-tasks/test-unit.sh" }

# ── ServerTests job: spawns crowdb-kv-server / crowdb-diskdb / crowdb-diskio ──
test-kv-server = { cmd = "cargo test -p crowdb-kv-server --tests" }
test-diskdb = { cmd = "cargo test -p crowdb-diskdb --tests" }
test-diskdb-client = { cmd = "cargo build -p crowdb-kv-server -p crowdb-diskdb && cargo test -p crowdb-diskdb-client --tests" }
test-chunkdb = { cmd = "cargo test -p crowdb-chunkdb --tests" }
test-chunk-client = { cmd = "cargo test -p crowdb-chunk-client --tests" }
test-diskio-client = { cmd = "cargo test -p crowdb-diskio-client --tests" }
test-access-s3 = { cmd = "cargo test -p crowdb-access-s3 --tests" }
test-access-iceberg = { cmd = "cargo test -p crowdb-access-iceberg --tests" }
test-access-server = { cmd = "cargo test -p crowdb-access-server --tests" }
test-monitor = { cmd = "cargo test -p crowdb-monitor --tests" }
test-server = { cmd = "bash tools/pixi-tasks/test-server.sh" }

# ── ConsoleTests job: spawns crowdb-kv-server via lifecycle::deploy_local ──
# Build the debug binary explicitly so tests find it at target/debug/.
test-console-shared = { cmd = "cargo build -p crowdb-kv-server && cargo test -p crowdb-console-shared --tests" }
test-console-cli = { cmd = "cargo test -p crowdb-cli --tests" }
test-console-server = { cmd = "cargo build -p crowdb-kv-server && cargo test -p crowdb-web --tests" }
test-console = { cmd = "bash tools/pixi-tasks/test-console.sh" }

# ── UITests job: Playwright browser E2E + subprocess spawning ──
test-console-ui = { cmd = "bash tools/pixi-tasks/test-console-ui.sh", depends-on = ["install-ui-deps"] }

# ── Full local suite (not a CI job; runs everything in one process) ──
# Grouped by CI job order. Each group task owns its component list;
# subprocess groups clean the environment before starting.
test-suite = { cmd = "bash tools/pixi-tasks/test-suite.sh", depends-on = ["build-cpp", "install-ui-deps"] }

# ── Coverage & LOC ───────────────────────────────────────────────
coverage = { cmd = "cargo tarpaulin --workspace --out Html --output-dir target/coverage --exclude-files '*/tests/*'", depends-on = ["install-deps"] }
loc = "tokei . .github --exclude swagger-ui --exclude third-party --exclude 'lib/crowdb-tree/build-*' --exclude target --exclude dist --exclude node_modules --exclude package-lock.json"

# ── Clean ────────────────────────────────────────────────────────
# Removes build products and disposable namespaced runtime artifacts. Durable
# local clusters below `.crowdb-runtime/persistent/` are always preserved.
clean = { cmd = "bash tools/pixi-tasks/clean-build.sh" }

# ── lib/crowdb-tree sanitizers ──────────────────────────────────────────

# AddressSanitizer build + tests. setarch -R disables ASLR (Linux only);
# on macOS we run ctest directly.
tree-asan = { cmd = "bash tools/pixi-tasks/tree-asan.sh" }

# ThreadSanitizer build + tests.
tree-tsan = { cmd = "bash tools/pixi-tasks/tree-tsan.sh" }

# UndefinedBehaviorSanitizer build + tests.
tree-ubsan = { cmd = "bash tools/pixi-tasks/tree-ubsan.sh" }
