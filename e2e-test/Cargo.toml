[package]
autotests = false
name = "e2e-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dev-dependencies]
crowdb-monitor = { path = "../container/crowdb-monitor" }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
hmac = "0.12"
md-5 = "0.10"
sha2 = "0.10"
percent-encoding = "2"
crowdb-console-shared = { path = "../lib/crowdb-console-shared" }
crowdb-access-server = { path = "../app/crowdb-access-server" }
crowdb-access-iceberg = { path = "../lib/crowdb-access-iceberg" }
crowdb-access-dataset = { path = "../lib/crowdb-access-dataset" }
crowdb-access-s3 = { path = "../lib/crowdb-access-s3" }
crowdb-sdk-native = { path = "../lib/crowdb-sdk-native" }
async-trait = "0.1"
axum = "0.7"
uuid = { version = "1", features = ["v4"] }
crowdb-chunk-client = { path = "../lib/crowdb-chunk-client" }
crowdb-chunk-kv-client = { path = "../lib/crowdb-chunk-kv-client" }
crowdb-chunk-stream = { path = "../lib/crowdb-chunk-stream" }
bincode = "1"
crowdb-common = { path = "../lib/crowdb-common/rust" }
crowdb-chunkdb-client = { path = "../lib/crowdb-chunkdb-client" }
crowdb-chunkdb = { path = "../app/crowdb-chunkdb", features = ["test-util"] }
bytes = "1"
flatbuffers = { workspace = true }
crowdb-diskio-client = { path = "../lib/crowdb-diskio-client", features = ["test-util"] }
crowdb-rpc-ffi = { path = "../lib/crowdb-rpc/ffi" }
crowdb-diskdb-client = { path = "../lib/crowdb-diskdb-client" }
crowdb-kv = { path = "../lib/crowdb-kv" }
crowdb-kv-client = { path = "../lib/crowdb-kv-client" }
crowdb-protocol = { path = "../lib/crowdb-protocol" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_json = "1"

[[test]]
name = "domain_test"
path = "tests/domain_test.rs"
