[package]
autotests = false
name = "e2e-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dev-dependencies]
bincode = "1"
crowdb-common = { path = "../lib/crowdb-common/rust" }
crowdb-chunkdb-client = { path = "../lib/crowdb-chunkdb-client" }
crowdb-chunkdb = { path = "../app/crowdb-chunkdb", features = ["test-util"] }
bytes = "1"
flatbuffers = { workspace = true }
crowdb-diskio-client = { path = "../lib/crowdb-diskio-client", features = ["test-util"] }
crowdb-rpc-ffi = { path = "../lib/crowdb-rpc/ffi" }
crowdb-diskdb-client = { path = "../lib/crowdb-diskdb-client" }
crowdb-kv = { path = "../lib/crowdb-kv" }
crowdb-kv-client = { path = "../lib/crowdb-kv-client" }
crowdb-protocol = { path = "../lib/crowdb-protocol" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"

[[test]]
name = "domain_test"
path = "tests/domain_test.rs"
