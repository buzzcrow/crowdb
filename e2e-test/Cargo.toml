[package]
autotests = false
name = "e2e-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dev-dependencies]
bytes = "1"
flatbuffers = { workspace = true }
crowdb-diskio-client = { path = "../lib/crowdb-diskio-client", features = ["test-util"] }
crowdb-rpc-ffi = { path = "../lib/crowdb-rpc/ffi" }
crowdb-diskdb-client = { path = "../lib/crowdb-diskdb-client" }
crowdb-kv = { path = "../lib/crowdb-kv" }
crowdb-kv-client = { path = "../lib/crowdb-kv-client" }
crowdb-protocol = { path = "../lib/crowdb-protocol" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"

[[test]]
name = "kv_test"
path = "tests/kv_test.rs"
