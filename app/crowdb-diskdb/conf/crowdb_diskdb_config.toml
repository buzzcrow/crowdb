# Canonical diskdb server config template. Tracked so the
# `tracked_config_file_loads_and_validates` test guards against
# stale/mismatched template edits. All sections are explicit; omitting
# any non-`[server]` section is also valid (serde fills from `Default`).

[server]
rpc_workers = 2
listen_addr = "0.0.0.0:11000"
http_listen_addr = "0.0.0.0:11100"
rpc_listen_addr = "0.0.0.0:11200"
kv_server_mgmt_seeds = ["http://127.0.0.1:10000"]

[storage]
zone_size_bytes = 17179869184
block_size_bytes = 1048576
allocate_granularity = 1048576
zone_rotate_count = 4
cas_retry_limit = 100

[heartbeat]
interval_secs = 10
miss_threshold = 3
temp_failure_timeout_secs = 900

[persistence]
# Coalesce concurrent frees without delaying the first request.
free_batch_enabled = false
# Maximum records per KV proposal; one oversized RPC remains atomic.
free_flush_max_batch = 256
compaction_cadence_secs = 300
snapshot_compaction_threshold = 4096
load_concurrency = 16

[scanner]
scan_interval_secs = 600
# Reconcile tentative ownership independently and at a deliberately low rate.
tentative_owner_scan_interval_secs = 600
# Traverse disk-group, disk, and zone serially, pausing after every zone.
tentative_owner_zone_delay_secs = 3
# Require a durable Absent observation to age for 24 hours before reclaiming.
tentative_owner_grace_secs = 86400
reverify_delay_ms = 1000

[scanner.ghost]
detect = true
auto_correct = false

[scanner.integrity]
verify = true
detect_owner_mismatch = false

[rebalance]
enabled = true
plan_interval_secs = 300
imbalance_threshold_pct = 20
max_jobs_per_cycle = 1
zone_delay_secs = 3

[allocator]
load_aware = true
load_aware_weight = "free_bytes"

[sync]
group0_store_id = 0
group0_group_id = 0
sync_interval_secs = 10

[reporting]
interval_secs = 10

[notify]
notify_enabled = false
