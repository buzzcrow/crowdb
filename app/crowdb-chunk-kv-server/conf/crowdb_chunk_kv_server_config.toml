# Chunk KV Server
# crowdb-chunk-kv-server --config <this-file>
# Read at startup. Sizes are integer bytes; 1 MiB = 1,048,576 bytes.
# Find maximum sustainable flush throughput with ample resources first, then
# reduce resources using measurements. Queues retain work; they do not add throughput.

# Unique process identity. Set node_id when registering through node management.
instance_id = 1
# node_id = 1
# Bind addresses may be unspecified; advertised addresses must be routable.
rpc_listen_addr = "0.0.0.0:21135"
rpc_advertise_addr = "127.0.0.1:21135"
http_listen_addr = "0.0.0.0:20135"
# Omit to leave the optional management endpoint out of instance observations.
# http_advertise_addr = "127.0.0.1:20135"
# Paxos KV Group-0 management endpoints used to discover storage and assignments.
group0_mgmt_seeds = ["http://127.0.0.1:10135"]
# RPC I/O workers are separate from Tree CPU/backend workers.
rpc_workers = 2
# Partitions share one process-wide Tree runtime. Per-partition caches/budgets
# still contribute to total memory use; this cap is not a process RSS limit.
max_hosted_partitions = 256
# Fallback catalog/grant reconciliation interval; watch events trigger earlier refreshes.
catalog_refresh_interval_ms = 5_000
# Remaining WAL records allowed before split preparation enters its final catch-up.
max_split_catchup_lag_records = 1_024
# Deadline for draining admitted work and checkpointing during shutdown.
shutdown_drain_timeout_ms = 30_000

[storage]
# Paxos KV store containing the range catalog and durable root metadata.
metadata_store_id = 1
# Stream ownership lease in milliseconds.
stream_writer_lease_ms = 30_000
# Replica count for both WAL streams and Tree chunks (1..5).
stream_mirror_copies = 2
# Tree and WAL allocation capacities, each in 1..256 MiB.
tree_chunk_capacity_bytes = 268_435_456
stream_chunk_capacity_bytes = 268_435_456
# 0 selects the route default; otherwise use a whole number of MiB in 1..256 MiB.
tree_strip_capacity_bytes = 0
# Host-wide live pin and pending final-release slots for all Tree writers/readers.
tree_pin_release_slots = 1_048_576
# DiskIO connections per endpoint and I/O workers, independent of the Tree pools.
diskio_connections_per_endpoint = 1
diskio_rpc_workers = 2

[partition]
# Per-partition ingress bounds, including admitted requests still being processed.
# Larger queues absorb bursts and retain memory without increasing service rate.
queue_requests = 1_024
queue_bytes = 67_108_864
# Maximum journal batch count and target bytes. One admitted request may exceed
# batch_bytes and is then handled alone; apply remains ordered within each partition.
batch_requests = 64
batch_bytes = 4_194_304
# API key/value limits; native Tree key and frame limits also apply.
max_key_bytes = 65_536
max_value_bytes = 16_777_216
# Recent deduplication results kept for retry handling; older requests can expire.
retained_results = 65_536
# Bound metadata reclamation work per maintenance pass.
metadata_reclaim_records_per_pass = 128

[monitor]
# Cluster-wide monitor identity and protocol versions. All owners in this domain
# must register a compatible descriptor; coordinate policy changes across owners.
domain = "chunk-kv"
service_registry_name = "chunk-kv"
driver_version = 1
capability_version = 1
# Heartbeat <= suspect <= dead. A dead owner must be fenced before lease expiry.
heartbeat_interval_ms = 2_000
suspect_after_ms = 6_000
dead_after_ms = 10_000
lease_duration_ms = 12_000
# Lease > clock skew + self-fence margin, and dead + margin <= lease.
max_clock_skew_ms = 1_000
self_fence_margin_ms = 1_000
# AutomaticSharedStorage permits automatic recovery; OperatorOnly requires intervention.
failure_policy = "AutomaticSharedStorage"
balance_policy = "count-first-v1"
# chunk_kv_range_balance is derived from [balance] on load; do not duplicate it here.

[balance]
# Disable automatic owner moves; local partition splitting remains available.
enabled = true
# Reserved: must remain 0 until reliable per-range live-byte measurements are available.
byte_weight_percent = 0
# Owner-count imbalance tolerated before proposing a move (0..100).
imbalance_tolerance_percent = 20
# Desired minimum partition count per live owner and local split size threshold.
target_partitions_per_owner = 4
target_partition_bytes = 1_073_741_824
# Required weighted improvement for moves (0..100) and minimum time between moves.
minimum_weighted_improvement_percent = 25
cooldown_ms = 60_000
# 0 disables the request-rate ceiling for candidate target owners.
max_owner_request_rate = 0

# Optional first-partition bootstrap. Omit for ordinary catalog-driven startup.
# Use persistent, nonzero identities for an intentional empty-cluster bootstrap.
# [bootstrap_partition]
# partition_id = { high = 1, low = 1 }
# tree_id = 1
# stream_name = { high = 1, low = 2 }
# owner_epoch = 1
# metadata_group_id = 1

# Optional explicit RPC RDMA configuration. Omit to retain transport environment
# defaults. This complete example selects the 256 KiB control/data class.
# Uncomment the table and its fields together, then set device/source for this host.
# [rpc_rdma]
# enabled = true
# allow_tcp_fallback = true
# listen_enabled = true
# port = 1
# device = ""
# source_address = ""
# gid = ""
# CQ/QP depths and posted receives; target <= rq_depth and SQ + target <= cq_depth.
# cq_count = 1
# cq_depth = 8_192
# sq_depth = 1_024
# rq_depth = 1_024
# posted_receive_target = 1_024
# wire_layout = "control_data"
# wire_slot_capacity = 263_168
# Send/receive batching and outstanding sends. A zero send window uses SQ depth;
# zero send_window_bytes disables the additional byte ceiling.
# send_batch_size = 16
# receive_batch_size = 1
# send_window_size = 0
# send_window_bytes = 0
# Completion polling limits and the power-of-two pending send queue capacity.
# poll_batch = 256
# verbs_poll_batch = 32
# poll_empty_budget = 256
# send_queue_capacity = 4_096
# Optional small-message aggregation (bounded by the transport frame capacity).
# aggregation_enabled = false
# aggregation_max_bytes = 65_536
# aggregation_max_frames = 256
# Registered send/receive arenas; size them together with the SQ/RQ windows.
# A zero registration budget derives the budget from the transport geometry.
# send_arena_bytes = 268_435_456
# receive_arena_bytes = 269_484_032
# registered_memory_budget_bytes = 0
# Large control-message assembly bounds, timeout, and aggregate byte budgets.
# max_control_message_bytes = 33_554_432
# control_assembly_timeout_ms = 30_000
# control_send_budget_bytes = 67_108_864
# control_receive_budget_bytes = 67_108_864

# Keep Tree field additions, removals, renames and explanations in sync with:
# app/crowdb-paxos-kv-server/conf/crowdb_paxos_kv_server_config.toml
# Each server owns its values independently; no shared include or override is loaded.

# Process-wide CPU/backend pools. Check CPU quotas and utilization when scaling.
# Resource diagnostics sample every 100 ms and flush at the server metrics-log
# interval. Each host/Tree resource reports its limit, current usage, average
# held sampled usage, and sampled maximum for that log window. The maximum is
# not an exact transient peak; sample count, age, gaps and errors show coverage.
# Averages retain fractional counts: worker avg=0.750 means 75% of one worker.
# Reserved capacity and allocated storage are reported separately. Budget
# denial counters distinguish Tree limits from shared host limits. Queue-slot
# usage includes prepaid progress registrations even when no job is runnable.
# Tree cache rows cover decoded bytes, page slots and request slots; they
# overlap the storage charged to budget partitions and must not be added to it.
[tree_runtime.host]
workers = 4
# Workers for synchronous PageStore calls; async concurrency also depends on the backend.
backend_workers = 2
# Larger queues retain more work without increasing service rate. Recheck
# lifecycle/Routing reservations when increasing queue capacity.
cpu_queue_limit = 256
backend_queue_limit = 256
# Maximum pending waiters per resource partition.
max_waiters_per_class = 256
# Retained queue/control reservation charged to host Routing, not an extra partition.
lifecycle_bytes = 4_194_304

# Shared limits for all Trees in this process. Resource classes cannot borrow
# from each other. These limits do not bound total process RSS.
[tree_runtime.host.limits]
# Source capture, run/range construction and complete-batch handoff.
handoff_bytes = 268_435_456
# Routing, publication, cache/load and controls, including lifecycle reservations.
routing_bytes = 536_870_912
# Consolidation, split/merge and checkpoint/writeback work.
reclaim_bytes = 134_217_728
# Ordinary writes, payload owners and retained COW allocations.
writer_bytes = 536_870_912
# Independent progress capacity for chosen/replay/gap apply work.
gap_repair_bytes = 67_108_864
# In-flight I/O tickets. More tickets alone do not parallelize a serial write pipeline.
io_operations = 128

# Per-Tree limits. All Trees still compete for the shared host resources above.
[tree_runtime.tree]
# The producer window must fit this CPU queue. Local queues must fit host queues.
# This also bounds ordinary apply/backend operation owners; replay has two spare slots.
cpu_queue_limit = 64
backend_queue_limit = 64
# Fixed queue/core/cache descriptors, charged to this Tree's Routing partition.
# Increase this together with cpu_queue_limit and tuning.cache_max_pages; a
# larger Routing limit alone does not enlarge this retained control reserve.
lifecycle_bytes = 1_048_576

[tree_runtime.tree.limits]
# Same categories as the host limits. Check both levels when changing a partition.
handoff_bytes = 67_108_864
routing_bytes = 268_435_456
# 64 MiB is an adjustable default, not a fixed checkpoint memory target.
reclaim_bytes = 67_108_864
writer_bytes = 134_217_728
gap_repair_bytes = 16_777_216
io_operations = 16

[tree]
# Durable frame size; the current public format supports at most 64 KiB.
# A logical leaf may exceed one frame.
# Must be at least 512 bytes and satisfy backend IU alignment. Logical working
# set size is independent of durable frame size.
frame_bytes = 65_536
# Decoded-cache byte watermark; tuning.cache_max_pages also limits page count.
buffer_pool_bytes = 67_108_864
# 0 = frame_bytes/4. Values larger than this spill to overflow; exactly 16 KiB
# remains inline with the default frame size.
max_inline_value = 0
# LZ4 trades CPU for storage bandwidth/space. Keep compression fixed in comparisons.
compression_lz4 = false
# Local block allocation/reclamation unit; ignored by file/mem-block and injected Chunk storage.
block_size = 67_108_864
# 0 = backend default: block 4 KiB, mem-block 1 byte, Chunk 64 KiB. A nonzero value
# must be a power of two that divides frame_bytes.
iu_size = 0

# Engine work granularity. Select these values from measurements.
[tree.tuning]
# Soft per-source rotation thresholds. Crossing either requests rotation;
# 0 requests rotation after every nonempty write.
# The source_max_* hard admission capacities below also apply.
memtable_flush_bytes = 16_777_216
memtable_flush_entries = 100_000
# Includes the writable source; the current read/handoff window requires 2..64.
max_memtable_count = 10
# Per-source admitted version/key capacities, including writes not yet applied.
# Raising soft thresholds alone may not enlarge batches if these limits bind first.
source_max_entries = 4_096
source_max_key_bytes = 1_048_576
# Additional accepted/replay allowance. Size it for accepted apply bursts.
# Only the next contiguous slot may use gap source capacity; higher holes use ordinary capacity or wait.
source_max_gap_entries = 64
source_max_gap_key_bytes = 131_072
# 0 = min(host workers, Tree io_operations). Explicit values must fit both limits.
flush_parallelism = 0
# Per-handoff-run entry/key/work-byte limits. Value owners are retained independently.
run_max_entries = 128
# Effective key capacity is max(run_max_key_bytes, max_key_size).
run_max_key_bytes = 262_144
run_max_bytes = 1_048_576
# Key-arena allocation granularity; must not exceed run_max_key_bytes.
run_key_block_bytes = 1_024
# Initial run-install window; later windows double. Balances early visible
# progress against prefix-array copying cost.
install_run_window = 64
# Visits per step/pass; the step size must not exceed the pass limit.
maintenance_visits_per_step = 64
maintenance_max_visits = 4_096
# Candidates/steps per pass. Larger limits increase work and reservations;
# they do not repair starvation caused by an incorrect scan cursor.
maintenance_max_candidates = 256
maintenance_max_steps = 1_024
# Local scratch per maintenance operation; independent of the total Reclaim budget.
maintenance_metadata_bytes = 1_048_576
# Decoded-cache page limit. Check this together with buffer_pool_bytes.
cache_max_pages = 256
# Split/merge thresholds for the physical primary record region, not logical leaf limits.
# Split is capped by frame/format capacity. Merge=0 disables merging; merged
# output must also fit the hysteresis target of about 75% of the split threshold.
leaf_split_bytes = 65_502
leaf_merge_bytes = 16_384
# Inner separator limit; encoded output must also fit the frame byte capacity.
inner_max_keys = 256
# 0 = max(1, inner_max_keys/4).
inner_merge_keys = 0
# Maximum key size; 0 = frame_bytes/2. Oversized keys are rejected before admission.
max_key_size = 0
