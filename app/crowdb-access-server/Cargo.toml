[package]
name = "crowdb-access-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent external protocol listeners for CROWDB."

[lints]
workspace = true

[features]
default = ["s3"]
test-util = []
iceberg = [
    "dep:async-trait",
    "dep:chrono",
    "dep:thiserror",
    "dep:crowdb-access-s3",
    "dep:crowdb-access-iceberg",
    "dep:crowdb-chunk-client",
    "dep:crowdb-chunk-kv-client",
    "dep:crowdb-kv-client",
    "dep:crowdb-protocol",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:percent-encoding",
    "dep:quick-xml",
    "dep:base64",
    "dep:md-5",
    "dep:serde_json",
    "dep:serde",
    "dep:sha2",
    "dep:sha1",
    "dep:crc",
]
s3-e2e = ["s3", "dep:crowdb-protocol"]
iceberg-e2e = ["iceberg"]
s3 = [
    "dep:async-trait",
    "dep:chrono",
    "dep:crowdb-access-s3",
    "dep:crowdb-chunk-client",
    "dep:crowdb-chunk-kv-client",
    "dep:crowdb-common",
    "dep:crowdb-kv-client",
    "dep:futures",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:percent-encoding",
    "dep:thiserror",
]

[dependencies]
async-trait = { version = "0.1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
crowdb-access-iceberg = { path = "../../lib/crowdb-access-iceberg", optional = true }
crowdb-access-s3 = { path = "../../lib/crowdb-access-s3", optional = true }
crowdb-chunk-client = { path = "../../lib/crowdb-chunk-client", optional = true }
crowdb-chunk-kv-client = { path = "../../lib/crowdb-chunk-kv-client", optional = true }
crowdb-common = { path = "../../lib/crowdb-common/rust", optional = true }
crowdb-kv-client = { path = "../../lib/crowdb-kv-client", optional = true }
crowdb-protocol = { path = "../../lib/crowdb-protocol", optional = true }
futures = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { workspace = true, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
percent-encoding = { version = "2", optional = true }
quick-xml = { version = "0.38", optional = true }
base64 = { version = "0.22", optional = true }
md-5 = { version = "0.10", optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
crc = { version = "3.3", optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
crowdb-access-server = { path = ".", default-features = false, features = ["test-util"] }
hmac = "0.12"
arc-swap = "1.9"
async-trait = "0.1"
crowdb-chunkdb-client = { path = "../../lib/crowdb-chunkdb-client" }
crowdb-diskdb-client = { path = "../../lib/crowdb-diskdb-client" }
crowdb-diskio-client = { path = "../../lib/crowdb-diskio-client", features = ["test-util"] }
crowdb-rpc-ffi = { path = "../../lib/crowdb-rpc/ffi" }
crowdb-test-harness = { path = "../../lib/crowdb-test-harness", features = ["chunk-kv", "chunkdb", "diskdb", "diskio"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util"] }

[[test]]
name = "s3_full_stack_test"
path = "tests/s3_full_stack_test.rs"
harness = false
required-features = ["s3-e2e"]

[[bin]]
name = "crowdb-iceberg"
path = "src/iceberg_main.rs"
required-features = ["iceberg"]

[[test]]
name = "iceberg_full_stack_test"
path = "tests/iceberg_full_stack_test.rs"
required-features = ["iceberg-e2e"]

[[test]]
name = "iceberg_file_storage_test"
path = "tests/iceberg_file_storage_test.rs"
required-features = ["iceberg-e2e"]

[[test]]
name = "iceberg_gc_control_test"
path = "tests/iceberg_gc_control_test.rs"
required-features = ["iceberg-e2e"]

[[test]]
name = "iceberg_gc_budget_test"
path = "tests/iceberg_gc_budget_test.rs"
required-features = ["iceberg"]

[[test]]
name = "iceberg_gc_capacity_test"
path = "tests/iceberg_gc_capacity_test.rs"
required-features = ["iceberg-e2e"]

[[test]]
name = "iceberg_file_http_test"
path = "tests/iceberg_file_http_test.rs"
required-features = ["iceberg-e2e"]
