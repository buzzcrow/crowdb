[package]
name = "crowdb-access-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent external protocol listeners for CROWDB."

[lints]
workspace = true

[features]
default = ["s3"]
test-util = ["crowdb-chunk-client/test-util"]
s3-e2e = ["s3"]
iceberg-e2e = []
s3 = [
    "dep:futures",
]

[dependencies]
hex = "0.4"
hmac = "0.12"
async-trait = "0.1"
bincode = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
crowdb-access-iceberg = { path = "../../lib/crowdb-access-iceberg" }
crowdb-access-dataset = { path = "../../lib/crowdb-access-dataset" }
crowdb-access-s3 = { path = "../../lib/crowdb-access-s3" }
crowdb-chunk-client = { path = "../../lib/crowdb-chunk-client" }
crowdb-chunk-kv-client = { path = "../../lib/crowdb-chunk-kv-client" }
crowdb-common = { path = "../../lib/crowdb-common/rust" }
crowdb-kv-client = { path = "../../lib/crowdb-kv-client" }
crowdb-protocol = { path = "../../lib/crowdb-protocol" }
crowdb-rpc-ffi = { path = "../../lib/crowdb-rpc/ffi" }
futures = { version = "0.3", optional = true }
http-body-util = "0.1"
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
quick-xml = { version = "0.38", features = ["serialize"] }
base64 = "0.22"
md-5 = "0.10"
openssl = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha1 = "0.10"
crc = "3.3"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
thiserror = { workspace = true }
sync_wrapper = { version = "1", features = ["futures"] }

[dev-dependencies]
bincode = "1"
crowdb-access-server = { path = ".", default-features = false, features = ["test-util"] }
futures = "0.3"
crowdb-console-shared = { path = "../../lib/crowdb-console-shared" }
arc-swap = "1.9"
async-trait = "0.1"
crowdb-chunkdb-client = { path = "../../lib/crowdb-chunkdb-client" }
crowdb-diskdb-client = { path = "../../lib/crowdb-diskdb-client" }
crowdb-diskio-client = { path = "../../lib/crowdb-diskio-client", features = ["test-util"] }
crowdb-test-harness = { path = "../../lib/crowdb-test-harness", features = ["chunk-kv", "chunkdb", "diskdb", "diskio"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util"] }

[[test]]
name = "s3_full_stack_test"
path = "tests/s3_full_stack_test.rs"
harness = false
required-features = ["s3-e2e"]

[[test]]
name = "iceberg_full_stack_test"
path = "tests/iceberg_full_stack_test.rs"
required-features = ["iceberg-e2e"]

[[test]]
name = "iceberg_file_storage_test"
path = "tests/iceberg_file_storage_test.rs"
required-features = ["iceberg-e2e"]

[[test]]
name = "iceberg_gc_control_test"
path = "tests/iceberg_gc_control_test.rs"
required-features = ["iceberg-e2e"]

[[test]]
name = "iceberg_gc_budget_test"
path = "tests/iceberg_gc_budget_test.rs"

[[test]]
name = "iceberg_gc_capacity_test"
path = "tests/iceberg_gc_capacity_test.rs"
required-features = ["iceberg-e2e"]

[[test]]
name = "iceberg_file_http_test"
path = "tests/iceberg_file_http_test.rs"
required-features = ["iceberg-e2e"]
