[package]
name = "crowdb-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "crowdb-web"
path = "src/main.rs"

[dependencies]
arc-swap = "1.7"
crowdb-chunkdb-client = { path = "../../lib/crowdb-chunkdb-client" }
crowdb-common = { path = "../../lib/crowdb-common/rust" }
crowdb-console-shared = { path = "../../lib/crowdb-console-shared" }
crowdb-diskdb-client = { path = "../../lib/crowdb-diskdb-client" }
crowdb-kv-client = { path = "../../lib/crowdb-kv-client" }
crowdb-monitor = { path = "../../container/crowdb-monitor" }
crowdb-protocol = { path = "../../lib/crowdb-protocol" }
crowdb-rpc-ffi = { path = "../../lib/crowdb-rpc/ffi" }
clap = { version = "4", features = ["derive"] }
dirs = "5"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
axum = "0.7"
async-trait = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
tracing = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
crowdb-chunk-kv-client = { path = "../../lib/crowdb-chunk-kv-client" }
crowdb-access-s3 = { path = "../../lib/crowdb-access-s3" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
crowdb-kv = { path = "../../lib/crowdb-kv" }
crowdb-rpc-ffi = { path = "../../lib/crowdb-rpc/ffi", features = ["test-util"] }
crowdb-test-harness = { path = "../../lib/crowdb-test-harness", features = ["diskdb"] }
