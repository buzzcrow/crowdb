<title id="title">One storage core, independent data models</title><desc id="desc">Iceberg, Dataset, and S3 share three storage layers: distributed metadata on top, chunk storage with chunk and disk management in the middle, and a Paxos cluster underneath.</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#132b3c"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526879"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2463a5"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#007f78"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7461a8"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6d8493"/></marker>
</defs>
<rect width="1100" height="830" rx="20" fill="#fbfcfd"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="49" font-size="27" fill="#132b3c" text-anchor="start" font-weight="700">One storage core, independent data models</text>
<text x="42" y="80" font-size="16" fill="#526879" text-anchor="start" font-weight="400">Application semantics stay with their access model; storage work is shared.</text>
<rect x="50" y="130" width="320" height="84" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="210.0" y="167.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Iceberg</text>
<text x="210.0" y="190.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Table · Snapshot · Manifest · File</text>
<polyline points="210,214 210,260" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="390" y="130" width="320" height="84" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="550.0" y="167.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Dataset</text>
<text x="550.0" y="190.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Dataset · Snapshot · Split · Sample</text>
<polyline points="550,214 550,260" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="730" y="130" width="320" height="84" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="890.0" y="167.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">S3</text>
<text x="890.0" y="190.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Bucket · Object</text>
<polyline points="890,214 890,260" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round"/>
<polyline points="210,260 890,260" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round"/>
<polyline points="550,260 550,298" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="50" y="298" width="1000" height="480" rx="17" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="70" y="331" font-size="20" fill="#007f78" text-anchor="start" font-weight="600">Shared storage</text>
<rect x="80" y="350" width="940" height="78" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="550.0" y="384.0" font-size="21" fill="#132b3c" text-anchor="middle" font-weight="600">Distributed metadata</text>
<text x="550.0" y="407.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Chunk-KV · range-based trees · dynamic partitions</text>
<polyline points="550,428 550,458" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="80" y="458" width="940" height="160" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="550" y="490" font-size="21" fill="#132b3c" text-anchor="middle" font-weight="600">Chunk storage</text>
<rect x="100" y="512" width="440" height="84" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="320.0" y="538.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Chunk management</text>
<text x="320.0" y="561.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">ChunkDB · placement and lifecycle</text>
<text x="320.0" y="584.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Chunk client · replication, EC, and streaming</text>
<rect x="560" y="512" width="440" height="84" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="780.0" y="538.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Disk management</text>
<text x="780.0" y="561.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">DiskDB · disk and block allocation</text>
<text x="780.0" y="584.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">DiskIO · asynchronous I/O over TCP / RDMA</text>
<polyline points="550,618 550,650" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#gray)"/>
<rect x="80" y="650" width="940" height="100" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="550" y="681" font-size="21" fill="#132b3c" text-anchor="middle" font-weight="600">Paxos cluster</text>
<rect x="100" y="700" width="440" height="32" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="320.0" y="722.0" font-size="16" fill="#132b3c" text-anchor="middle" font-weight="600">Group 0 · System metadata</text>
<rect x="560" y="700" width="440" height="32" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="780.0" y="722.0" font-size="16" fill="#132b3c" text-anchor="middle" font-weight="600">Groups 1–X · Replicated KV</text>
<text x="1058" y="808" font-size="12" fill="#526879" text-anchor="end" font-weight="400">CROWDB</text>
</g></svg>
