<title id="title">S3 I/O: bucket and key to Chunk storage</title><desc id="desc">PUT stores bytes before publishing the object; GET uses object metadata to locate those bytes.</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#132b3c"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526879"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2463a5"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#007f78"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7461a8"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6d8493"/></marker>
</defs>
<rect width="1400" height="750" rx="20" fill="#fbfcfd"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="49" font-size="27" fill="#132b3c" text-anchor="start" font-weight="700">S3 I/O: bucket and key to Chunk storage</text>
<text x="42" y="80" font-size="16" fill="#526879" text-anchor="start" font-weight="400">PUT stores bytes before publishing the object; GET uses object metadata to locate those bytes.</text>
<rect x="40" y="120" width="1320" height="245" rx="17" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="60" y="153" font-size="20" fill="#007f78" text-anchor="start" font-weight="600">PUT / upload</text>
<rect x="60" y="187" width="290" height="110" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="205.0" y="226.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">S3 client → S3 access</text>
<text x="205.0" y="249.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">PUT bucket / key</text>
<text x="205.0" y="272.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Validate request and body</text>
<polyline points="350,242 390,242" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="390" y="187" width="290" height="110" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="535.0" y="226.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">Chunk client → DiskIO</text>
<text x="535.0" y="249.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Stream to shared Chunk storage</text>
<text x="535.0" y="272.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Large or small writer</text>
<polyline points="680,242 720,242" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="720" y="187" width="290" height="110" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="865.0" y="226.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">Publish object metadata</text>
<text x="865.0" y="249.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Chunk-KV: bucket + key</text>
<text x="865.0" y="272.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Locations, length, ETag, attributes</text>
<polyline points="1010,242 1050,242" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="1050" y="187" width="290" height="110" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="1195.0" y="226.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="600">Return success</text>
<text x="1195.0" y="249.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Object is visible by key</text>
<text x="1195.0" y="272.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Payload completion precedes publication</text>
<text x="60" y="337" font-size="15" fill="#526879" text-anchor="start" font-weight="400">Multipart uses the same storage path; Complete publishes the selected parts as one object.</text>
<rect x="40" y="400" width="1320" height="245" rx="17" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="60" y="433" font-size="20" fill="#2463a5" text-anchor="start" font-weight="600">GET / Range GET</text>
<rect x="60" y="467" width="290" height="110" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="205.0" y="506.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">S3 client → S3 access</text>
<text x="205.0" y="529.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">GET bucket / key</text>
<text x="205.0" y="552.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Optional byte range</text>
<polyline points="350,522 390,522" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="390" y="467" width="290" height="110" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="535.0" y="506.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">Read object metadata</text>
<text x="535.0" y="529.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Chunk-KV: resolve bucket + key</text>
<text x="535.0" y="552.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Select locations and requested range</text>
<polyline points="680,522 720,522" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="720" y="467" width="290" height="110" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="865.0" y="506.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">Chunk client → DiskIO</text>
<text x="865.0" y="529.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Read mirror / EC layout</text>
<text x="865.0" y="552.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Verify the requested bytes</text>
<polyline points="1010,522 1050,522" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="1050" y="467" width="290" height="110" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="1195.0" y="506.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="600">Stream the response</text>
<text x="1195.0" y="529.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Return bytes as the client consumes</text>
<text x="1195.0" y="552.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Bounded buffers and backpressure</text>
<text x="60" y="617" font-size="15" fill="#526879" text-anchor="start" font-weight="400">HEAD and listing use metadata; reading an object payload follows the Chunk storage path.</text>
<text x="700" y="700" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">The S3 access library connects directly to CROWDB metadata and payload services.</text>
<text x="1358" y="728" font-size="12" fill="#526879" text-anchor="end" font-weight="400">CROWDB</text>
</g></svg>
