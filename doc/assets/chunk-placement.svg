<rect width="1400" height="1020" rx="20" fill="#fbfcfd"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="49" font-size="27" fill="#132b3c" text-anchor="start" font-weight="700">Chunk placement across nodes and disks</text>
<text x="42" y="80" font-size="16" fill="#526879" text-anchor="start" font-weight="400">The client obtains a persisted layout, then writes payload directly through DiskIO.</text>
<rect x="480" y="115" width="440" height="80" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="700.0" y="150.0" font-size="21" fill="#fff" text-anchor="middle" font-weight="600">Chunk client</text>
<text x="700.0" y="173.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Allocate or query a chunk; use its locations</text>
<rect x="50" y="270" width="1300" height="280" rx="17" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="700" y="303" font-size="20" fill="#2463a5" text-anchor="middle" font-weight="600">How a chunk is allocated</text>
<rect x="80" y="340" width="310" height="88" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="235.0" y="368.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">ChunkDB</text>
<text x="235.0" y="391.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Choose replica / EC placement</text>
<text x="235.0" y="414.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Build the chunk layout</text>
<rect x="500" y="340" width="300" height="88" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="650.0" y="379.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">DiskDB</text>
<text x="650.0" y="402.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Allocate physical blocks</text>
<rect x="970" y="340" width="350" height="88" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="1145.0" y="368.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Paxos-KV</text>
<text x="1145.0" y="391.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Persisted Chunk metadata</text>
<text x="1145.0" y="414.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Nonzero store groups</text>
