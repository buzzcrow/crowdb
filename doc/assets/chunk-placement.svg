<text x="65" y="223" font-size="15" fill="#2463a5" text-anchor="start" font-weight="400">1. Allocate / query</text>
<polyline points="390,384 435,384 435,155 480,155" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="455" y="257" font-size="15" fill="#2463a5" text-anchor="start" font-weight="400">4. Return Chunk ID, strips, and segment locations</text>
<polyline points="390,359 500,359" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="650" y="328" font-size="13" fill="#2463a5" text-anchor="middle" font-weight="400">2. Allocate blocks</text>
