<text x="690" y="482" font-size="15" fill="#7461a8" text-anchor="middle" font-weight="400">3. Persist the complete layout</text>
<polyline points="920,155 1378,155 1378,600" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round"/>
<text x="1110" y="139" font-size="16" fill="#007f78" text-anchor="middle" font-weight="600">Payload · TCP / RDMA</text>
