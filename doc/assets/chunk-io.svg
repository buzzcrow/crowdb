<text x="725.0" y="656.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Pipeline 2</text>
<text x="725.0" y="679.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Batch → frame → mirror writes</text>
<polyline points="865,661 930,661" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="930" y="625" width="410" height="72" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="1135" y="650" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Shared chunk 2</text>
<rect x="943" y="661" width="124" height="25" rx="4" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="1005" y="679" font-size="13" fill="#132b3c" text-anchor="middle" font-weight="400">obj 2</text>
<rect x="1073" y="661" width="124" height="25" rx="4" fill="#f1f5f7" stroke="#6d8493" stroke-width="1.3"/>
<text x="1135" y="679" font-size="13" fill="#132b3c" text-anchor="middle" font-weight="400">obj 5</text>
<rect x="1203" y="661" width="124" height="25" rx="4" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="1265" y="679" font-size="13" fill="#132b3c" text-anchor="middle" font-weight="400">…</text>
<polyline points="520,640 550,640 550,761 585,761" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="585" y="725" width="280" height="72" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="725.0" y="756.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Pipeline M</text>
<text x="725.0" y="779.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Batch → frame → mirror writes</text>
<polyline points="865,761 930,761" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="930" y="725" width="410" height="72" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="1135" y="750" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Shared chunk M</text>
<rect x="943" y="761" width="124" height="25" rx="4" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="1005" y="779" font-size="13" fill="#132b3c" text-anchor="middle" font-weight="400">obj 3</text>
<rect x="1073" y="761" width="124" height="25" rx="4" fill="#f1f5f7" stroke="#6d8493" stroke-width="1.3"/>
<text x="1135" y="779" font-size="13" fill="#132b3c" text-anchor="middle" font-weight="400">…</text>
<rect x="1203" y="761" width="124" height="25" rx="4" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="1265" y="779" font-size="13" fill="#132b3c" text-anchor="middle" font-weight="400">obj N</text>
<text x="60" y="826" font-size="15" fill="#526879" text-anchor="start" font-weight="400">Each pipeline owns one active chunk. Objects keep independent locations and completion results.</text>
<rect x="40" y="878" width="645" height="450" rx="17" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="60" y="911" font-size="20" fill="#2463a5" text-anchor="start" font-weight="600">Large write: direct EC</text>
<text x="60" y="941" font-size="16" fill="#526879" text-anchor="start" font-weight="400">k data shards + m parity shards</text>
<rect x="60" y="985" width="180" height="82" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="150.0" y="1021.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Data shards</text>
<text x="150.0" y="1044.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Arrive incrementally</text>
<rect x="300" y="965" width="365" height="72" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="482.5" y="996.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">DiskIO data writes</text>
<text x="482.5" y="1019.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Submit each data shard</text>
<rect x="300" y="1080" width="365" height="72" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="482.5" y="1100.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">EC parity + DiskIO</text>
<text x="482.5" y="1123.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Accumulate parity as data arrives</text>
<text x="482.5" y="1146.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Write parity at strip end</text>
<polyline points="240,1026 270,1026 270,1001 300,1001" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<polyline points="240,1026 270,1026 270,1116 300,1116" fill="none" stroke="#7461a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#purple)"/>
<polyline points="665,1001 675,1001 675,1170 490,1170 490,1190" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<polyline points="482,1152 482,1190" fill="none" stroke="#7461a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#purple)"/>
<rect x="60" y="1190" width="605" height="60" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="362.5" y="1226.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="600">Join data + parity → seal chunk</text>
<text x="60" y="1280" font-size="15" fill="#526879" text-anchor="start" font-weight="400">Next-strip data can overlap the preceding strip’s parity I/O.</text>
<text x="60" y="1306" font-size="15" fill="#526879" text-anchor="start" font-weight="400">Partial tails retain their exact valid byte length.</text>
<rect x="715" y="878" width="645" height="450" rx="17" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="735" y="911" font-size="20" fill="#7461a8" text-anchor="start" font-weight="600">Small write: mirror → EC</text>
<text x="735" y="941" font-size="16" fill="#526879" text-anchor="start" font-weight="400">Optional conversion · 8 data + 4 parity</text>
<rect x="735" y="985" width="175" height="82" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="822.5" y="1021.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">Mirror strips</text>
<text x="822.5" y="1044.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Write every replica</text>
<rect x="940" y="985" width="185" height="82" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="1032.5" y="1010.0" font-size="16" fill="#132b3c" text-anchor="middle" font-weight="600">Parity accumulators</text>
<text x="1032.5" y="1033.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Fold each</text>
<text x="1032.5" y="1056.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">closed strip</text>
<rect x="1155" y="985" width="185" height="82" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="1247.5" y="1021.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">Parity DiskIO</text>
<text x="1247.5" y="1044.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Write + fsync</text>
<polyline points="910,1026 940,1026" fill="none" stroke="#7461a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#purple)"/>
<polyline points="1125,1026 1155,1026" fill="none" stroke="#7461a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#purple)"/>
<polyline points="1247,1067 1247,1122" fill="none" stroke="#7461a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#purple)"/>
<polyline points="822,1067 822,1122" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="735" y="1122" width="605" height="85" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="1037.5" y="1159.5" font-size="18" fill="#fff" text-anchor="middle" font-weight="600">ChunkDB publishes the 8+4 layout</text>
<text x="1037.5" y="1182.5" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">One healthy replica per mirror set becomes a data shard</text>
<text x="735" y="1242" font-size="15" fill="#526879" text-anchor="start" font-weight="400">Data shards reuse the stored mirror bytes.</text>
<text x="735" y="1273" font-size="15" fill="#526879" text-anchor="start" font-weight="400">Mirrors remain authoritative until EC publication.</text>
<text x="735" y="1304" font-size="15" fill="#526879" text-anchor="start" font-weight="400">Incomplete or failed conversion stays mirrored.</text>
<rect x="40" y="1355" width="1320" height="90" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="700.0" y="1395.0" font-size="21" fill="#fff" text-anchor="middle" font-weight="600">Payload completion → per-object locations → access-library publication</text>
<text x="700.0" y="1418.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Iceberg, Dataset, and S3 own visibility. Shared writers confirm the durable cursor for immediately readable publication.</text>
<text x="1358" y="1478" font-size="12" fill="#526879" text-anchor="end" font-weight="400">CROWDB</text>
</g></svg>
