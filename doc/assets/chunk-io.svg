<rect x="310" y="280" width="300" height="72" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="460.0" y="311.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Dedicated pipeline B</text>
