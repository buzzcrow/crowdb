<polyline points="225,672 255,672 255,640 290,640" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="65" y="709" width="160" height="42" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="145.0" y="736.0" font-size="16" fill="#132b3c" text-anchor="middle" font-weight="600">Object N</text>
<polyline points="225,730 255,730 255,640 290,640" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="290" y="590" width="230" height="100" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="405.0" y="624.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Shared writer pool</text>
<text x="405.0" y="647.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Bounded admission</text>
<text x="405.0" y="670.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Choose a pipeline</text>
<polyline points="520,640 550,640 550,561 585,561" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="585" y="525" width="280" height="72" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="725.0" y="556.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Pipeline 1</text>
<text x="725.0" y="579.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Batch → frame → mirror writes</text>
<polyline points="865,561 930,561" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="930" y="525" width="410" height="72" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="1135" y="550" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Shared chunk 1</text>
<rect x="943" y="561" width="124" height="25" rx="4" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="1005" y="579" font-size="13" fill="#132b3c" text-anchor="middle" font-weight="400">obj 1</text>
<rect x="1073" y="561" width="124" height="25" rx="4" fill="#f1f5f7" stroke="#6d8493" stroke-width="1.3"/>
<text x="1135" y="579" font-size="13" fill="#132b3c" text-anchor="middle" font-weight="400">obj 4</text>
<rect x="1203" y="561" width="124" height="25" rx="4" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="1265" y="579" font-size="13" fill="#132b3c" text-anchor="middle" font-weight="400">…</text>
<polyline points="520,640 550,640 550,661 585,661" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
