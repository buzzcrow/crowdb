</defs>
<rect width="1400" height="1500" rx="20" fill="#fbfcfd"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="49" font-size="27" fill="#132b3c" text-anchor="start" font-weight="700">Chunk write paths</text>
<text x="42" y="80" font-size="16" fill="#526879" text-anchor="start" font-weight="400">Large writes own their pipeline and chunks; small writes share a bounded pool.</text>
<rect x="40" y="115" width="1320" height="300" rx="17" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="60" y="148" font-size="20" fill="#2463a5" text-anchor="start" font-weight="600">Large write · 1:1 · dedicated pipeline and active chunk</text>
<rect x="60" y="182" width="200" height="72" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="160.0" y="213.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Large object A</text>
<text x="160.0" y="236.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Streaming input</text>
<rect x="310" y="182" width="300" height="72" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="460.0" y="213.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Dedicated pipeline A</text>
<text x="460.0" y="236.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Bounded framing and buffers</text>
<rect x="660" y="182" width="330" height="72" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="825.0" y="213.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Chunk A</text>
<text x="825.0" y="236.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Object A only · mirror or EC</text>
<rect x="1040" y="182" width="300" height="72" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="1190.0" y="213.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="600">Seal → location(s)</text>
<text x="1190.0" y="236.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Complete this object</text>
<polyline points="260,218 310,218" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
