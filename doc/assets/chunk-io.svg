<text x="825.0" y="311.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Chunk B</text>
<text x="825.0" y="334.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Object B only · mirror or EC</text>
<rect x="1040" y="280" width="300" height="72" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="1190.0" y="311.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="600">Seal → location(s)</text>
<text x="1190.0" y="334.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Complete this object</text>
<polyline points="260,316 310,316" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="610,316 660,316" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="990,316 1040,316" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="60" y="390" font-size="15" fill="#526879" text-anchor="start" font-weight="400">A larger object seals and rotates through additional dedicated chunks; it never shares them with another object.</text>
<rect x="40" y="440" width="1320" height="410" rx="17" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="60" y="473" font-size="20" fill="#007f78" text-anchor="start" font-weight="600">Small write · N:M · M pipelines, M active shared chunks</text>
<text x="145" y="516" font-size="17" fill="#007f78" text-anchor="middle" font-weight="600">N objects</text>
<rect x="65" y="535" width="160" height="42" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="145.0" y="562.0" font-size="16" fill="#132b3c" text-anchor="middle" font-weight="600">Object 1</text>
<polyline points="225,556 255,556 255,640 290,640" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="65" y="593" width="160" height="42" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="145.0" y="620.0" font-size="16" fill="#132b3c" text-anchor="middle" font-weight="600">Object 2</text>
<polyline points="225,614 255,614 255,640 290,640" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
