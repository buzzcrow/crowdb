<title id="title">Iceberg write: native files to an atomic table commit</title><desc id="desc">The native upload path returns a storage-bearing URI before the engine builds its manifests.</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#132b3c"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526879"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2463a5"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#007f78"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7461a8"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6d8493"/></marker>
</defs>
<rect width="1400" height="800" rx="20" fill="#fbfcfd"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="49" font-size="27" fill="#132b3c" text-anchor="start" font-weight="700">Iceberg write: native files to an atomic table commit</text>
<text x="42" y="80" font-size="16" fill="#526879" text-anchor="start" font-weight="400">The native upload path returns a storage-bearing URI before the engine builds its manifests.</text>
<rect x="40" y="135" width="400" height="110" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="240.0" y="174.0" font-size="19" fill="#132b3c" text-anchor="middle" font-weight="600">1. Native Parquet upload</text>
<text x="240.0" y="197.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Engine / loader → Iceberg access</text>
<text x="240.0" y="220.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Bounded streaming + checksum verification</text>
<rect x="500" y="135" width="400" height="110" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="700.0" y="174.0" font-size="19" fill="#132b3c" text-anchor="middle" font-weight="600">2. Durable Chunk storage</text>
<text x="700.0" y="197.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Chunk client → DiskIO → disks</text>
<text x="700.0" y="220.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Complete file bytes and an owner-bound root</text>
<rect x="960" y="135" width="400" height="110" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="1160.0" y="174.0" font-size="19" fill="#132b3c" text-anchor="middle" font-weight="600">3. Publish immutable file</text>
<text x="1160.0" y="197.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Sign the root descriptor into its URI</text>
<text x="1160.0" y="220.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Create the file record in Chunk-KV</text>
<polyline points="440,190 500,190" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<polyline points="900,190 960,190" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<polyline points="1160,245 1160,295" fill="none" stroke="#7461a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#purple)"/>
<rect x="40" y="295" width="1320" height="120" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="700.0" y="339.0" font-size="23" fill="#fff" text-anchor="middle" font-weight="600">Returned URI carries the Chunk location</text>
<text x="700.0" y="362.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">s3://iceberg/&lt;table&gt;/f/v1/&lt;name&gt;.&lt;locator&gt;.parquet</text>
<text x="700.0" y="385.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Signed locator: file identity + length + integrity + Chunk directory root</text>
<polyline points="240,415 240,495" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="40" y="495" width="400" height="110" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="240.0" y="534.0" font-size="19" fill="#132b3c" text-anchor="middle" font-weight="600">4. Build standard manifests</text>
<text x="240.0" y="557.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Use the returned URI as file_path</text>
<text x="240.0" y="580.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Store manifests and the manifest list</text>
<rect x="500" y="495" width="400" height="110" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="700.0" y="534.0" font-size="19" fill="#132b3c" text-anchor="middle" font-weight="600">5. REST catalog commit</text>
<text x="700.0" y="557.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Validate requirements against table state</text>
<text x="700.0" y="580.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Prepare immutable metadata JSON</text>
<rect x="960" y="495" width="400" height="110" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="1160.0" y="534.0" font-size="19" fill="#132b3c" text-anchor="middle" font-weight="600">6. Publish the table head</text>
<text x="1160.0" y="557.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">One compare-and-swap in Chunk-KV</text>
<text x="1160.0" y="580.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">The new snapshot becomes visible</text>
<polyline points="440,550 500,550" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="900,550 960,550" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="40" y="660" width="1320" height="86" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="700.0" y="698.0" font-size="23" fill="#132b3c" text-anchor="middle" font-weight="600">Iceberg files live in CROWDB Chunk storage</text>
<text x="700.0" y="721.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">S3-compatible FileIO is a protocol surface; this path needs no separate S3 storage backend.</text>
<text x="1358" y="778" font-size="12" fill="#526879" text-anchor="end" font-weight="400">CROWDB</text>
</g></svg>
