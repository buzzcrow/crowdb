<title id="title">Disk I/O over RDMA or TCP</title><desc id="desc">Transport buffers stay owned through network, device I/O, and response completion.</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#132b3c"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526879"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2463a5"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#007f78"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7461a8"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6d8493"/></marker>
</defs>
<rect width="1400" height="950" rx="20" fill="#fbfcfd"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="49" font-size="27" fill="#132b3c" text-anchor="start" font-weight="700">Disk I/O over RDMA or TCP</text>
<text x="42" y="80" font-size="16" fill="#526879" text-anchor="start" font-weight="400">Transport buffers stay owned through network, device I/O, and response completion.</text>
<rect x="40" y="125" width="330" height="600" rx="17" fill="#f1f5f7" stroke="#6d8493" stroke-width="1.3"/>
<text x="60" y="158" font-size="20" fill="#6d8493" text-anchor="start" font-weight="600">Client</text>
<rect x="65" y="188" width="280" height="70" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="205.0" y="218.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="600">Chunk client</text>
<text x="205.0" y="241.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Payload operations</text>
<rect x="65" y="298" width="280" height="78" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="205.0" y="332.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">DiskIO client</text>
<text x="205.0" y="355.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Route Segment to its storage node</text>
<rect x="65" y="421" width="280" height="110" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="205.0" y="460.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">RPC request</text>
<text x="205.0" y="483.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Read / write / fsync</text>
<text x="205.0" y="506.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Owned payload buffers</text>
<polyline points="205,258 205,298" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="205,376 205,421" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="425" y="238" width="300" height="96" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="575.0" y="270.0" font-size="22" fill="#132b3c" text-anchor="middle" font-weight="600">RDMA</text>
<text x="575.0" y="293.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Registered memory</text>
<text x="575.0" y="316.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">SEND / RECV + completion queues</text>
<rect x="425" y="420" width="300" height="78" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="575.0" y="454.0" font-size="22" fill="#132b3c" text-anchor="middle" font-weight="600">TCP</text>
<text x="575.0" y="477.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Framed control + payload</text>
<polyline points="345,460 395,460 395,286 425,286" fill="none" stroke="#7461a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#purple)"/>
<polyline points="345,484 395,484 395,459 425,459" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="780" y="125" width="580" height="600" rx="17" fill="#f1f5f7" stroke="#6d8493" stroke-width="1.3"/>
<text x="800" y="158" font-size="20" fill="#6d8493" text-anchor="start" font-weight="600">Storage node</text>
<rect x="805" y="238" width="530" height="96" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="1070.0" y="270.0" font-size="21" fill="#fff" text-anchor="middle" font-weight="600">crowdb-rpc → DiskIO</text>
<text x="1070.0" y="293.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Receive request and retain its buffer</text>
<text x="1070.0" y="316.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Validate Segment, range, and payload length</text>
<polyline points="725,286 805,286" fill="none" stroke="#7461a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#purple)"/>
<polyline points="725,459 752,459 752,310 805,310" fill="none" stroke="#2463a5" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="805" y="385" width="530" height="88" rx="12" fill="#f0edf9" stroke="#7461a8" stroke-width="1.3"/>
<text x="1070.0" y="413.0" font-size="20" fill="#132b3c" text-anchor="middle" font-weight="600">Retained I/O buffers</text>
<text x="1070.0" y="436.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Eligible RDMA paths reuse registered receive storage</text>
<text x="1070.0" y="459.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Alignment edges use explicit staging buffers</text>
<polyline points="1070,334 1070,385" fill="none" stroke="#7461a8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#purple)"/>
<rect x="805" y="518" width="530" height="70" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="1070.0" y="548.0" font-size="21" fill="#132b3c" text-anchor="middle" font-weight="600">I/O engine</text>
<text x="1070.0" y="571.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">io_uring or platform fallback</text>
<polyline points="1070,473 1070,518" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="805" y="642" width="162" height="58" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="886.0" y="677.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">Local disk 1</text>
<polyline points="1070,588 1070,615 886,615 886,642" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="989" y="642" width="162" height="58" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="1070.0" y="677.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">Local disk 2</text>
<polyline points="1070,588 1070,615 1070,615 1070,642" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="1173" y="642" width="162" height="58" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="1254.0" y="677.0" font-size="17" fill="#132b3c" text-anchor="middle" font-weight="600">Local disk 3</text>
<polyline points="1070,588 1070,615 1254,615 1254,642" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="575" y="568" font-size="16" fill="#526879" text-anchor="middle" font-weight="400">Same DiskIO operations</text>
<text x="575" y="595" font-size="16" fill="#526879" text-anchor="middle" font-weight="400">on either transport</text>
<rect x="40" y="802" width="1320" height="92" rx="12" fill="#132b3c" stroke="#132b3c" stroke-width="1.3"/>
<text x="700.0" y="832.0" font-size="21" fill="#fff" text-anchor="middle" font-weight="600">Read payload / write or fsync result → selected transport → caller</text>
<text x="700.0" y="855.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Synchronized writes respond after the write and disk flush complete.</text>
<text x="700.0" y="878.0" font-size="14" fill="#c7dce4" text-anchor="middle" font-weight="400">Read buffers remain retained through response SEND and caller release.</text>
<polyline points="1070,725 1070,802" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<polyline points="205,802 205,725" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="1358" y="928" font-size="12" fill="#526879" text-anchor="end" font-weight="400">CROWDB</text>
</g></svg>
