<title id="title">One continuous logical range across chunks</title><desc id="desc">Chunk rollover changes physical storage, while logical offsets keep increasing.</desc>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#132b3c"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526879"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2463a5"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#007f78"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7461a8"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6d8493"/></marker>
</defs>
<rect width="1200" height="540" rx="20" fill="#fbfcfd"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="49" font-size="27" fill="#132b3c" text-anchor="start" font-weight="700">One continuous logical range across chunks</text>
<text x="42" y="80" font-size="16" fill="#526879" text-anchor="start" font-weight="400">Chunk rollover changes physical storage, while logical offsets keep increasing.</text>
<text x="60" y="140" font-size="14" fill="#007f78" text-anchor="start" font-weight="600">LOGICAL BYTE RANGE</text>
<rect x="60" y="175" width="360" height="64" rx="0" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="240.0" y="214" font-size="21" fill="#132b3c" text-anchor="middle" font-weight="600">[0, L1)</text>
<rect x="420" y="175" width="360" height="64" rx="0" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="600.0" y="214" font-size="21" fill="#132b3c" text-anchor="middle" font-weight="600">[L1, L2)</text>
<rect x="780" y="175" width="300" height="64" rx="0" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="930.0" y="214" font-size="21" fill="#132b3c" text-anchor="middle" font-weight="600">[L2, tail)</text>
<polyline points="60,165 60,245" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round"/>
<text x="60" y="155" font-size="15" fill="#526879" text-anchor="middle" font-weight="400">0</text>
<polyline points="420,165 420,245" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round"/>
<text x="420" y="155" font-size="15" fill="#526879" text-anchor="middle" font-weight="400">L1</text>
<polyline points="780,165 780,245" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round"/>
<text x="780" y="155" font-size="15" fill="#526879" text-anchor="middle" font-weight="400">L2</text>
<polyline points="1080,165 1080,245" fill="none" stroke="#6d8493" stroke-width="2.2" stroke-linejoin="round"/>
<text x="1080" y="155" font-size="15" fill="#526879" text-anchor="middle" font-weight="400">tail</text>
<polyline points="1080,207 1150,207" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="1115" y="187" font-size="13" fill="#007f78" text-anchor="middle" font-weight="400">append</text>
<polyline points="240.0,239 240.0,320" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="72" y="320" width="336" height="84" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="240.0" y="357.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Chunk A</text>
<text x="240.0" y="380.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Sealed</text>
<polyline points="600.0,239 600.0,320" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="432" y="320" width="336" height="84" rx="12" fill="#eaf1fb" stroke="#2463a5" stroke-width="1.3"/>
<text x="600.0" y="357.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Chunk B</text>
<text x="600.0" y="380.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Sealed</text>
<polyline points="930.0,239 930.0,320" fill="none" stroke="#007f78" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="792" y="320" width="276" height="84" rx="12" fill="#e4f5f1" stroke="#007f78" stroke-width="1.3"/>
<text x="930.0" y="357.0" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">Chunk C</text>
<text x="930.0" y="380.0" font-size="14" fill="#526879" text-anchor="middle" font-weight="400">Active tail</text>
<text x="600" y="454" font-size="18" fill="#132b3c" text-anchor="middle" font-weight="600">end(A) = start(B) = L1     ·     end(B) = start(C) = L2</text>
<text x="600" y="491" font-size="15" fill="#526879" text-anchor="middle" font-weight="400">No logical gaps at rollover. The journal owner decides when an old prefix can be trimmed.</text>
<text x="1158" y="518" font-size="12" fill="#526879" text-anchor="end" font-weight="400">CROWDB</text>
</g></svg>
