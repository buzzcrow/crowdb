openapi: 3.1.0
info:
  title: CrowDB Dataset control API v2
  version: 2.0.0
  description: >-
    Capability-gated Dataset control operations. Clients must discover required
    capabilities before mutation. An absent capability is unavailable; clients
    must not downgrade a v2 mutation to v1. The capability list advertises only
    implemented operation families. Existing v1 control and binary framing remain
    available under their original routes. Metadata GET routes require
    bounded-inspection; explicit POST inspection preparation requires
    inspection-preparation. Dataset creation, stable/retention changes and receipts
    require dataset-management; direct Snapshot head updates require snapshot-head-update;
    Split reads require split-revisions; complete Split preparation requires split-preparation;
    direct Split head updates require split-head-update; versioned
    stateless reads require stateless-reads. Upload, Snapshot composition preparation and retirement
    require uploads, composition-preparation and snapshot-reclaim respectively, advertised only
    when the upload service is configured. Query parameters are strict and duplicate
    keys fail. Snapshot preparation JSON/input/Manifest are limited to 8 MiB;
    standalone Split preparation JSON and final bindings are limited to 1 MiB.
    Composition and standalone Split begin/edit/evaluate/prepare/publish workflow routes return 501;
    legacy draft reads, abandonment and cleanup remain available for old records.
servers:
  - url: /api/dataset/v2
security:
  - bearerAuth: []
paths:
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}:
    put:
      operationId: prepareSnapshot
      summary: Prepare complete Snapshot content from retained caller inputs
      description: >-
        Requires composition-preparation and a configured upload service. Caller
        chooses the Snapshot ID and retains the complete parent/source/schema/
        Sample patches/Split definitions. Parent and schema are required nullable
        fields; null schema inherits the fixed parent's schema. Frozen sources and
        inherited definitions name exact revisions; currentSplit is never resolved
        during retries. Body, native input and final Manifest are bounded to 8 MiB,
        with 30 seconds for computation. Each patch ID occurs once; upsert patches
        specified fields and preserves other effective parent fields. Uploaded
        fields carry id/length/md5 from a completed result; conversion performs no
        metadata query and the authority validates the descriptor before claiming
        its final Snapshot owner. The complete root is installed last, after final
        index, initial Split membership and payload ownership. Complete results
        are readable by ID before head publication. Retry the same ID and full
        input after unknown outcomes; different content or initial Split binding
        conflicts. No editing/evaluation progress, operation mapping or staging
        owner is stored. Capture the intended head base before computation, then
        update the Dataset head separately. There is no workflow or v1 fallback.
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrepareSnapshot'}
      responses:
        '200':
          description: Complete immutable result; latest/stable are unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreparedSnapshot'}
        '409':
          description: Resource content, descriptor or Split policy conflicts
          $ref: '#/components/responses/InspectionError'
        '413':
          description: Body, native input, final Manifest or computation exceeds bounds
          $ref: '#/components/responses/InspectionError'
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/head:
    get:
      operationId: datasetHead
      summary: Read mutable names and their current opaque head generation
      description: >-
        Requires head-inspection capability. Generation covers the exact head
        including its internal fence. An absent head has null generation. Stable
        changes and reclaim fences may change generation without changing latest.
        Clients must treat the token as opaque and preserve it without decoding.
      parameters:
        - in: path
          name: dataset
          required: true
          schema: {type: string}
      responses:
        '200':
          description: One consistent observation of the current head
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Head'}
        '404':
          description: Dataset or namespace is unavailable
    put:
      operationId: updateSnapshotHead
      summary: Select a complete Snapshot using an explicit head condition
      description: >-
        Requires snapshot-head-update. The input contains only the complete resource ID
        and explicit nullable expected_head; no draft or attempt identity is read.
        Stable is preserved. Same-current-target retries confirm the current effect;
        stale conditions after another publication return observed_head without
        a confirmation query or implicit content rebase. Unknown outcomes do not
        create response history. The JSON body is limited to 4096 bytes.
      parameters:
        - {$ref: '#/components/parameters/dataset'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSnapshotHead'}
      responses:
        '200':
          description: Current effect confirmed without a historical response receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Head'}
        default:
          $ref: '#/components/responses/InspectionError'
  /capabilities:
    get:
      operationId: datasetCapabilities
      summary: Discover supported Dataset control operation families
      responses:
        '200':
          description: Supported API version and capability names
          headers:
            x-request-id:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
        '401':
          description: Missing or invalid configured bearer token
        '429':
          description: API admission capacity exhausted
        '504':
          description: Request deadline expired
  /namespaces/dataset-ns/datasets:
    get:
      operationId: listDatasets
      summary: Discover existing Dataset identities
      parameters:
        - {$ref: '#/components/parameters/after'}
        - {$ref: '#/components/parameters/limit'}
      responses:
        '200':
          description: Bounded metadata result; counts and byte lengths are decimal strings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetPage'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshot-inventory:
    get:
      operationId: snapshotInventory
      summary: List complete Snapshot inventory
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/after'}
        - {$ref: '#/components/parameters/limit'}
      responses:
        '200':
          description: Bounded metadata result; counts and byte lengths are decimal strings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SnapshotPage'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/roots:
    get:
      operationId: snapshotRoots
      summary: List complete parentless Snapshot roots
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/after'}
        - {$ref: '#/components/parameters/limit'}
      responses:
        '200':
          description: Bounded metadata result; counts and byte lengths are decimal strings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SnapshotPage'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/children:
    get:
      operationId: snapshotChildren
      summary: List complete children of a concrete Snapshot
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
        - {$ref: '#/components/parameters/after'}
        - {$ref: '#/components/parameters/limit'}
      responses:
        '200':
          description: Bounded metadata result; counts and byte lengths are decimal strings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SnapshotPage'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/summary:
    get:
      operationId: snapshotSummary
      summary: Read bounded complete Snapshot metadata
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
      responses:
        '200':
          description: Bounded metadata result; counts and byte lengths are decimal strings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SnapshotSummary'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/schema:
    get:
      operationId: snapshotSchema
      summary: Read an ordered Schema window
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
        - {$ref: '#/components/parameters/after'}
        - {$ref: '#/components/parameters/limit'}
      responses:
        '200':
          description: Bounded metadata result; counts and byte lengths are decimal strings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SchemaPage'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/samples:
    get:
      operationId: snapshotSamples
      summary: Read exact binary Sample IDs in byte order
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
        - {$ref: '#/components/parameters/after'}
        - {$ref: '#/components/parameters/limit'}
      responses:
        '200':
          description: Bounded metadata result; counts and byte lengths are decimal strings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SamplePage'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/matrix:
    get:
      operationId: snapshotMatrix
      summary: Read effective field metadata without payload access
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
        - {$ref: '#/components/parameters/after'}
        - {$ref: '#/components/parameters/limit'}
        - in: query
          name: fields
          required: true
          description: JSON-encoded array of 1 to 12 exact field names; continuation binds this projection.
          schema: {type: string}
      responses:
        '200':
          description: Bounded metadata result; counts and byte lengths are decimal strings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatrixPage'}
        default:
          $ref: '#/components/responses/InspectionError'
    post:
      operationId: exactSnapshotMatrix
      summary: Project a bounded explicit ID window without creating a read session
      description: Read-only query, including Sample IDs obtained from a Split member page. Retains request order.
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sample_ids, fields]
              properties:
                sample_ids: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string}}
                fields: {type: array, minItems: 1, maxItems: 12, uniqueItems: true, items: {type: string}}
      responses:
        '200':
          description: Effective field metadata only; no payload or consumption progress mutation.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/MatrixRow'}}
        default:
          $ref: '#/components/responses/InspectionError'

  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/contains:
    get:
      operationId: snapshotContains
      summary: Look up exact binary Sample membership
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
        - in: query
          name: sample
          required: true
          description: Canonical padded base64 of a nonempty Sample ID, at most 16384 decoded bytes.
          schema: {type: string}
      responses:
        '200':
          description: Bounded metadata result; counts and byte lengths are decimal strings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contains'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/inspection:
    get:
      operationId: snapshotInspection
      summary: Read explicit metadata preparation status
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
      responses:
        '200':
          description: Bounded metadata result; counts and byte lengths are decimal strings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InspectionPreparation'}
        default:
          $ref: '#/components/responses/InspectionError'
    post:
      operationId: prepareSnapshotInspection
      summary: Rebuild complete legacy inspection metadata
      description: Explicit mutation with a thirty-second deadline, a 9 MiB source-record limit and an 8 MiB embedded-Manifest limit. Writes complete index rows and installs the summary last without durable preparation progress. Retry rebuilds from the source or reuses an existing summary without writes. Errors propagate without confirmation reads. Does not change publication heads or acknowledge reads.
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
      responses:
        '200':
          description: Complete metadata readiness; revision and rows_written are zero compatibility fields.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InspectionPreparation'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/split-head:
    put:
      operationId: updateSplitHead
      summary: Conditionally update currentSplit from a complete resource
      description: Requires split-head-update. Caller supplies the target and both explicit nullable preconditions, without a draft or attempt ID. A conflict carries observed_head for caller review; the server does not rebase or query again to confirm a CAS outcome.
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSplitHead'}
      responses:
        '200':
          description: Current effect confirmed, without a historical response receipt.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SplitHead'}
        default:
          $ref: '#/components/responses/InspectionError'
    get:
      operationId: splitHead
      parameters:
        - in: path
          name: dataset
          required: true
          schema: {type: string}
        - in: path
          name: snapshot
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Revision-bound operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SplitHead'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/split-revisions:
    get:
      operationId: splitHistory
      description: Lists complete revisions, including results that have not updated currentSplit. Snapshot read admission applies.
      parameters:
        - in: path
          name: dataset
          required: true
          schema: {type: string}
        - in: path
          name: snapshot
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/after'}
        - {$ref: '#/components/parameters/limit'}
      responses:
        '200':
          description: Revision-bound operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SplitRevisionPage'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/split-revisions/{revision}:
    put:
      operationId: prepareSplitRevision
      summary: Prepare complete immutable membership from caller-owned inputs
      description: >-
        Requires split-preparation. The caller retains revision ID, policy and
        complete definitions. No operation, edit or evaluation cursor is accepted.
        Computation is bounded to 30 seconds and 1 MiB input/final bindings.
        Retry the same ID and input after an unknown outcome; incomplete work is
        recomputed, while an identical complete result is reused. Different input
        at a complete ID conflicts. Frozen sources retain their supplied revision.
        This operation does not update currentSplit; capture its intended base
        before computation and update split-head separately. No draft fallback.
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
        - in: path
          name: revision
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrepareSplitRevision'}
      responses:
        '200':
          description: Complete immutable resource, readable before head publication
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SplitRevision'}
        '409':
          description: Resource ID already has different input, or validation conflicts
          $ref: '#/components/responses/InspectionError'
        '413':
          description: Request body exceeds 1 MiB
          $ref: '#/components/responses/InspectionError'
        default:
          $ref: '#/components/responses/InspectionError'
    get:
      operationId: splitRevision
      description: Reads a complete immutable revision by ID without requiring currentSplit publication. Snapshot read admission applies.
      parameters:
        - in: path
          name: dataset
          required: true
          schema: {type: string}
        - in: path
          name: snapshot
          required: true
          schema: {type: string}
        - in: path
          name: revision
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Revision-bound operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SplitRevision'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/split-revisions/{revision}/splits/{name}/members:
    get:
      operationId: splitMembers
      parameters:
        - in: path
          name: dataset
          required: true
          schema: {type: string}
        - in: path
          name: snapshot
          required: true
          schema: {type: string}
        - in: path
          name: revision
          required: true
          schema: {type: string}
        - in: path
          name: name
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/after'}
        - {$ref: '#/components/parameters/limit'}
      responses:
        '200':
          description: Revision-bound operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SamplePage'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/split-drafts/{operation}:
    get:
      deprecated: true
      description: Read-only observation of an existing legacy draft; never resumes work.
      operationId: splitDraft
      parameters:
        - in: path
          name: dataset
          required: true
          schema: {type: string}
        - in: path
          name: operation
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Revision-bound operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SplitDraft'}
        default:
          $ref: '#/components/responses/InspectionError'
    delete:
      deprecated: true
      description: Abandon an existing legacy draft for cleanup.
      operationId: abandonSplitDraft
      parameters:
        - in: path
          name: dataset
          required: true
          schema: {type: string}
        - in: path
          name: operation
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftRevision'}
      responses:
        '200':
          description: Revision-bound operation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SplitDraft'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/reads/bind:
    post:
      operationId: bindRead
      description: Resolve immutable Snapshot and Split versions without creating read state.
      parameters:
        - {$ref: '#/components/parameters/dataset'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadPlanV2'}
      responses:
        '200':
          description: Client-owned continuation; no TTL, remote acknowledgement or close.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadBinding'}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/reads/next:
    post:
      operationId: nextReadBatch
      description: Replay this continuation; save the returned next cursor after processing.
      parameters:
        - {$ref: '#/components/parameters/dataset'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadContinuation'}
      responses:
        '200':
          description: Bounded batch; null next means end of selection.
          content:
            application/vnd.crowdb.dataset-batch.v1:
              schema: {type: string, format: binary}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/preview:
    get:
      operationId: snapshotFieldPreview
      summary: Read a bounded binary field prefix for text or hex presentation
      description: >-
        Never acknowledges an application read. Response bytes are capped at 64 KiB;
        uploaded parts are independently integrity-checked with a 4 MiB per-part
        allocation cap and five-second payload deadline. Full-field MD5 identifies
        the entire value, not the truncated prefix. External legacy locators without
        supported payload storage return an explicit error, never an arbitrary URL.
      parameters:
        - {$ref: '#/components/parameters/dataset'}
        - {$ref: '#/components/parameters/snapshot'}
        - in: query
          name: sample
          required: true
          schema: {type: string, description: Canonical padded base64 Sample ID}
        - in: query
          name: field
          required: true
          schema: {type: string}
        - in: query
          name: max_bytes
          schema: {type: integer, minimum: 1, maximum: 65536, default: 65536}
      responses:
        '200':
          description: Binary prefix or explicit missing/tombstone state
          content:
            application/json:
              schema:
                type: object
                required: [state, length, md5, data, truncated]
                properties:
                  state: {enum: [value, missing, tombstone]}
                  length: {type: [string, 'null']}
                  md5: {type: [string, 'null']}
                  data: {type: [string, 'null'], description: Canonical padded base64; empty string is an empty value}
                  truncated: {type: boolean}
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}:
    put:
      operationId: createDatasetV2
      summary: Create a Dataset
      parameters:
      - $ref: '#/components/parameters/dataset'
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetInfo'
        default:
          $ref: '#/components/responses/InspectionError'
    get:
      operationId: getDatasetV2
      summary: Read Dataset metadata
      parameters:
      - $ref: '#/components/parameters/dataset'
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetInfo'
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/names/stable:
    put:
      operationId: setStableSnapshot
      summary: Set stable without changing latest
      parameters:
      - $ref: '#/components/parameters/dataset'
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetInfo'
        default:
          $ref: '#/components/responses/InspectionError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableSnapshot'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/retain:
    post:
      operationId: retainSnapshotV2
      summary: Retain Snapshot retention
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: snapshot
        required: true
        schema: &id001
          $ref: '#/components/schemas/OpaqueId'
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetainedSnapshot'
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/release:
    post:
      operationId: releaseSnapshotV2
      summary: Release Snapshot retention
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: snapshot
        required: true
        schema: *id001
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetainedSnapshot'
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/snapshots/{snapshot}/reclaim:
    get:
      operationId: observeSnapshotLifecycleV2
      summary: Observe bounded protection and retirement facts without mutation
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: snapshot
        required: true
        schema: *id001
      responses:
        '200':
          description: Observed facts, not permission to reclaim; parent reachability is not evaluated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotLifecycle'
        default:
          $ref: '#/components/responses/InspectionError'
    post:
      operationId: reclaimSnapshotV2
      summary: Mark Snapshot deletion and observe background retirement
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: snapshot
        required: true
        schema: *id001
      responses:
        '200':
          description: Durable deletion status. Background workers advance cleanup after the grace deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotReclaim'
        default:
          $ref: '#/components/responses/InspectionError'
      description: Latest, stable, retained or live-parent Snapshots are protected.
        This empty-body action only marks deletion and observes durable status; repeated calls
        do not drive cleanup. Nonempty bodies, including cleanup cursor or completion inputs,
        are rejected. Background workers retire owners before metadata. Physical capacity
        recovery remains a separate ChunkDB responsibility.
  /namespaces/dataset-ns/datasets/{dataset}/commits/{attempt}:
    get:
      operationId: commitStatusV2
      summary: Read a legacy publication receipt
      description: Returns existing legacy receipts without backfill. New Snapshot and Split publication creates no historical receipts; retry the same conditional request to confirm its current effect.
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: attempt
        required: true
        schema: *id001
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitStatus'
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/split-drafts/{operation}/cleanup:
    post:
      deprecated: true
      operationId: cleanupSplitDraft
      summary: Retire obsolete Split work
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: operation
        required: true
        schema: *id001
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitCleanup'
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/uploads:
    post:
      operationId: createUploadV2
      summary: Create a Dataset-scoped multipart upload
      parameters:
      - $ref: '#/components/parameters/dataset'
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
        default:
          $ref: '#/components/responses/InspectionError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpload'
  /namespaces/dataset-ns/datasets/{dataset}/uploads/{upload}:
    get:
      operationId: getUploadV2
      summary: Inspect upload progress
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: upload
        required: true
        schema: *id001
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
        default:
          $ref: '#/components/responses/InspectionError'
    delete:
      operationId: abortUploadV2
      summary: Abort an unowned upload
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: upload
        required: true
        schema: *id001
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/uploads/{upload}/complete:
    post:
      operationId: completeUploadV2
      summary: Verify and complete upload parts
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: upload
        required: true
        schema: *id001
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
        default:
          $ref: '#/components/responses/InspectionError'
  /namespaces/dataset-ns/datasets/{dataset}/uploads/{upload}/parts/{index}:
    put:
      operationId: uploadPartV2
      summary: Write one bounded upload part
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: upload
        required: true
        schema: *id001
      - in: path
        name: index
        required: true
        schema:
          $ref: '#/components/schemas/Decimal'
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPart'
        default:
          $ref: '#/components/responses/InspectionError'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 4194304
  /namespaces/dataset-ns/datasets/{dataset}/compositions/{operation}:
    get:
      deprecated: true
      operationId: getComposition
      summary: Observe an existing legacy composition without resuming it
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: operation
        required: true
        schema: *id001
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionDraft'
        default:
          $ref: '#/components/responses/InspectionError'
    delete:
      deprecated: true
      operationId: abandonComposition
      summary: Abandon an unpublished composition
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: operation
        required: true
        schema: *id001
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionDraft'
        default:
          $ref: '#/components/responses/InspectionError'
      description: Cleanup is separately resumable through POST cleanup; abandonment never removes a successful publication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRevision'
  /namespaces/dataset-ns/datasets/{dataset}/compositions/{operation}/cleanup:
    post:
      deprecated: true
      operationId: cleanupComposition
      summary: Advance bounded obsolete composition cleanup
      parameters:
      - $ref: '#/components/parameters/dataset'
      - in: path
        name: operation
        required: true
        schema: *id001
      responses:
        '200':
          description: Successful bounded operation. Integer counts are exact decimal strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionCleanup'
        default:
          $ref: '#/components/responses/InspectionError'
      description: Repeat until complete. Prepared resources allow scratch and edit payload cleanup; completed
        candidate ownership permits staging-owner retirement. Final resource owners remain until Snapshot reclamation.
components:
  parameters:
    dataset:
      in: path
      name: dataset
      required: true
      schema: {type: string}
    snapshot:
      in: path
      name: snapshot
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
    after:
      in: query
      name: after
      description: Opaque canonical base64 continuation; preserve query and immutable scope. Empty pages may continue.
      schema: {type: string, maxLength: 43692}
    limit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    InspectionError:
      description: >-
        400 invalid or duplicate query; 401 unauthorized; 404 unavailable;
        409 inspection_not_prepared; 413 read_limit; 422 inspection_unsupported;
        429 capacity; 499 cancelled; 500 integrity; 503 unavailable; 504 timeout.
        Unknown query keys are rejected. No error triggers unbounded fallback.
      content:
        application/json:
          schema:
            type: object
            required: [code, message, request_id, retryable]
            properties:
              code: {type: string}
              message: {type: string}
              request_id: {type: string}
              retryable: {type: boolean}
              observed_head:
                oneOf:
                  - {$ref: '#/components/schemas/SplitHead'}
                  - {$ref: '#/components/schemas/Head'}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Head:
      type: object
      required: [latest, stable, generation]
      properties:
        latest:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
        stable:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
        generation:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
    UpdateSnapshotHead:
      type: object
      additionalProperties: false
      required: [snapshot, expected_head]
      properties:
        snapshot: {$ref: '#/components/schemas/OpaqueId'}
        expected_head:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
    Capabilities:
      type: object
      required: [api_version, capabilities]
      properties:
        api_version:
          type: integer
          const: 2
        capabilities:
          type: array
          uniqueItems: true
          items: {type: string}
          description: Unknown names may be ignored; required names must be present.
    DatasetInfo:
      type: object
      required: [id, namespace, name, latest, stable]
      properties:
        id: {type: string}
        namespace: {type: string}
        name: {type: string}
        latest: {type: [string, 'null']}
        stable: {type: [string, 'null']}
    SnapshotSummary:
      type: object
      required: [id, parent, schema_version, field_count, sample_count, manifest_sha256, inspection, reason]
      properties:
        id: {type: string}
        parent: {type: [string, 'null']}
        schema_version: {type: integer}
        field_count: {type: integer}
        sample_count: {type: string, pattern: '^[0-9]+$'}
        manifest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        inspection: {enum: [ready, unsupported]}
        reason: {type: [string, 'null']}
    FieldDefinition:
      type: object
      required: [name, required]
      properties:
        name: {type: string}
        required: {type: boolean}
    FieldMetadata:
      type: object
      required: [name, storage, length, md5, source_snapshot]
      properties:
        name: {type: string}
        storage: {enum: [inline, payload, tombstone]}
        length: {type: string, pattern: '^[0-9]+$'}
        md5: {type: [string, 'null']}
        source_snapshot: {type: string}
    MatrixRow:
      type: object
      required: [id, fields]
      properties:
        id: {type: string, description: Canonical padded base64 Sample ID}
        fields:
          type: array
          description: Requested field order; null means missing, distinct from tombstone.
          items:
            anyOf:
              - {$ref: '#/components/schemas/FieldMetadata'}
              - {type: 'null'}
    Contains:
      type: object
      required: [contains]
      properties:
        contains: {type: boolean}
    InspectionPreparation:
      type: object
      required: [snapshot, revision, rows_written, state, reason]
      properties:
        snapshot: {type: string}
        revision: {type: string, pattern: '^[0-9]+$', description: Zero for complete rebuilds; historical GET progress can retain a nonzero value.}
        rows_written: {type: string, pattern: '^[0-9]+$', description: Zero for complete rebuilds; historical GET progress can retain a nonzero value.}
        state: {enum: [preparing, ready, unsupported], description: Preparing is observable only for historical progress through GET. New POST results describe a complete index.}
        reason: {type: [string, 'null']}
    DatasetPage:
      type: object
      required: [entries, after]
      properties:
        after: {type: [string, 'null']}
        entries:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DatasetInfo'}
    SnapshotPage:
      type: object
      required: [entries, after]
      properties:
        after: {type: [string, 'null']}
        entries:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/SnapshotSummary'}
    SchemaPage:
      type: object
      required: [entries, after]
      properties:
        after: {type: [string, 'null']}
        entries:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/FieldDefinition'}
    SamplePage:
      type: object
      required: [entries, after]
      properties:
        after: {type: [string, 'null']}
        entries:
          type: array
          maxItems: 100
          items: {type: string, description: Canonical padded base64 Sample ID}
    MatrixPage:
      type: object
      required: [entries, after]
      properties:
        after: {type: [string, 'null']}
        entries:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/MatrixRow'}
    Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Exact unsigned 64-bit integer encoded as a canonical decimal string.
    OpaqueId:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: Nonzero opaque identity.
    NullableRevision:
      type: [string, 'null']
      pattern: '^[0-9a-f]{32}$'
    NullableGeneration:
      type: [string, 'null']
      pattern: '^[0-9a-f]{64}$'
    Predicate:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {const: all}
        - type: object
          additionalProperties: false
          required: [kind, ids]
          properties:
            kind: {const: explicit}
            ids: {type: array, maxItems: 10000, items: {type: string}}
        - type: object
          additionalProperties: false
          required: [kind, value]
          properties:
            kind: {enum: [prefix, keyword]}
            value: {type: string, description: Nonempty canonical padded base64}
        - type: object
          additionalProperties: false
          required: [kind, start, end]
          properties:
            kind: {const: range}
            start: {type: string}
            end: {type: string}
        - type: object
          additionalProperties: false
          required: [kind, field, value]
          properties:
            kind: {const: field_match}
            field: {type: string}
            value: {type: string, description: Canonical padded base64; empty is an exact empty inline value}
        - type: object
          additionalProperties: false
          required: [kind, items]
          properties:
            kind: {enum: [and, or]}
            items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Predicate'}}
        - type: object
          additionalProperties: false
          required: [kind, item]
          properties:
            kind: {const: not}
            item: {$ref: '#/components/schemas/Predicate'}
      description: Maximum depth 32 and 1024 nodes. IDs are binary base64, never text normalization.
    SplitPolicy:
      type: object
      additionalProperties: false
      required: [overlap, coverage]
      properties:
        overlap: {enum: [disjoint, allow_overlap]}
        coverage: {enum: [require_complete, allow_unassigned]}
    SplitSource:
      type: object
      additionalProperties: false
      required: [snapshot, revision, name]
      properties:
        snapshot: {$ref: '#/components/schemas/OpaqueId'}
        revision: {$ref: '#/components/schemas/OpaqueId'}
        name: {type: string, minLength: 1, description: Exact UTF-8 name, at most 255 bytes}
    SplitOrigin:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {const: evaluated}
        - type: object
          additionalProperties: false
          required: [kind, source]
          properties:
            kind: {const: inherited}
            source: {$ref: '#/components/schemas/SplitSource'}
    SplitDefinition:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, predicate]
          properties:
            kind: {const: selection}
            predicate: {$ref: '#/components/schemas/Predicate'}
        - type: object
          additionalProperties: false
          required: [kind, seed, weights, index]
          properties:
            kind: {const: weighted_partition}
            seed: {$ref: '#/components/schemas/Decimal'}
            index: {type: integer, minimum: 0}
            weights:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [name, weight]
                properties:
                  name: {type: string}
                  weight: {type: integer, minimum: 1, maximum: 4294967295}
      description: Uses sample-id-sha256-v1 with ordered weights and checked u32 sum.
    DraftSplit:
      type: object
      additionalProperties: false
      required: [name, definition, origin]
      properties:
        name: {type: string}
        definition: {$ref: '#/components/schemas/SplitDefinition'}
        origin: {$ref: '#/components/schemas/SplitOrigin'}
    PrepareSplitRevision:
      type: object
      additionalProperties: false
      required: [policy, splits]
      properties:
        policy: {$ref: '#/components/schemas/SplitPolicy'}
        splits: {type: array, items: {$ref: '#/components/schemas/DraftSplit'}}
    DraftRevision:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {$ref: '#/components/schemas/Decimal'}
    UpdateSplitHead:
      type: object
      additionalProperties: false
      required: [revision, expected_revision, expected_head]
      properties:
        revision: {$ref: '#/components/schemas/OpaqueId'}
        expected_revision: {$ref: '#/components/schemas/NullableRevision'}
        expected_head: {$ref: '#/components/schemas/NullableGeneration'}
    CommitTarget:
      oneOf:
        - type: object
          required: [kind, snapshot]
          properties:
            kind: {const: snapshot}
            snapshot: {$ref: '#/components/schemas/OpaqueId'}
        - type: object
          required: [kind, snapshot, revision]
          properties:
            kind: {const: split_revision}
            snapshot: {$ref: '#/components/schemas/OpaqueId'}
            revision: {$ref: '#/components/schemas/OpaqueId'}
    DraftProgress:
      type: object
      required: [state]
      properties:
        state: {enum: [editing, evaluating, evaluated, prepared, committing, published, abandoned]}
        input_revision: {$ref: '#/components/schemas/Decimal'}
        next_page: {$ref: '#/components/schemas/Decimal'}
        binding: {type: string}
        target: {$ref: '#/components/schemas/CommitTarget'}
        attempt: {$ref: '#/components/schemas/OpaqueId'}
    SplitDraft:
      type: object
      required: [operation, snapshot, expected_revision, revision, policy, splits, progress]
      properties:
        operation: {$ref: '#/components/schemas/OpaqueId'}
        snapshot: {$ref: '#/components/schemas/OpaqueId'}
        expected_revision: {$ref: '#/components/schemas/NullableRevision'}
        revision: {$ref: '#/components/schemas/Decimal'}
        policy: {$ref: '#/components/schemas/SplitPolicy'}
        splits: {type: array, items: {$ref: '#/components/schemas/DraftSplit'}}
        progress: {$ref: '#/components/schemas/DraftProgress'}
    SplitRevision:
      type: object
      required: [snapshot, revision, operation, evaluator_version, policy, splits]
      properties:
        snapshot: {$ref: '#/components/schemas/OpaqueId'}
        revision: {$ref: '#/components/schemas/OpaqueId'}
        operation: {$ref: '#/components/schemas/OpaqueId'}
        evaluator_version: {const: 1}
        policy: {$ref: '#/components/schemas/SplitPolicy'}
        splits:
          type: array
          items:
            type: object
            required: [name, definition, origin, count]
            properties:
              name: {type: string}
              definition: {$ref: '#/components/schemas/SplitDefinition'}
              origin: {$ref: '#/components/schemas/SplitOrigin'}
              count: {$ref: '#/components/schemas/Decimal'}
    SplitHead:
      type: object
      required: [snapshot, revision, generation]
      properties:
        snapshot: {$ref: '#/components/schemas/OpaqueId'}
        revision: {$ref: '#/components/schemas/NullableRevision'}
        generation: {$ref: '#/components/schemas/NullableGeneration'}
    SplitRevisionPage:
      type: object
      required: [entries, after]
      properties:
        after: {type: [string, 'null']}
        entries:
          type: array
          maxItems: 100
          items:
            type: object
            required: [snapshot, revision, operation, split_count]
            properties:
              snapshot: {$ref: '#/components/schemas/OpaqueId'}
              revision: {$ref: '#/components/schemas/OpaqueId'}
              operation: {$ref: '#/components/schemas/OpaqueId'}
              split_count: {type: integer}
    SplitPreview:
      type: object
      required: [input_revision, next_page, complete, member_counts, validation]
      properties:
        input_revision: {$ref: '#/components/schemas/Decimal'}
        next_page: {$ref: '#/components/schemas/Decimal'}
        complete: {type: boolean}
        member_counts: {type: array, items: {$ref: '#/components/schemas/Decimal'}}
        validation:
          type: object
          required: [scanned, assigned, unassigned, overlapping, unassigned_examples, overlap_examples]
          properties:
            scanned: {$ref: '#/components/schemas/Decimal'}
            assigned: {$ref: '#/components/schemas/Decimal'}
            unassigned: {$ref: '#/components/schemas/Decimal'}
            overlapping: {$ref: '#/components/schemas/Decimal'}
            unassigned_examples: {type: array, items: {type: string}}
            overlap_examples: {type: array, items: {type: string}}
    CommitReceipt:
      type: object
      required: [attempt, target, expected_head, committed_head]
      properties:
        attempt: {$ref: '#/components/schemas/OpaqueId'}
        target: {$ref: '#/components/schemas/CommitTarget'}
        expected_head: {$ref: '#/components/schemas/NullableGeneration'}
        committed_head: {type: string, pattern: '^[0-9a-f]{64}$'}
    ReadPlanV2:
      type: object
      additionalProperties: false
      required: [snapshot, selection, fields, batch_size, partition, shuffle, split]
      description: >-
        Snapshot latest/stable and null Split revision resolve into the returned
        continuation. Selection and Split filtering precede shuffle and worker
        partitioning. There is no persisted read plan, preparation or progress.
      properties:
        snapshot: {type: string, description: Concrete ID or latest/stable}
        selection: {$ref: '#/components/schemas/Predicate'}
        fields: {type: array, maxItems: 256, uniqueItems: true, items: {type: string}}
        batch_size: {type: integer, minimum: 1, maximum: 10000}
        partition:
          type: object
          additionalProperties: false
          required: [worker, workers, rank, world_size]
          properties:
            worker: {type: integer, minimum: 0, maximum: 65535}
            workers: {type: integer, minimum: 1, maximum: 65535}
            rank: {type: integer, minimum: 0, maximum: 65535}
            world_size: {type: integer, minimum: 1, maximum: 65535}
        shuffle:
          oneOf:
            - {type: 'null'}
            - type: object
              additionalProperties: false
              required: [seed, group_size]
              properties:
                seed: {$ref: '#/components/schemas/Decimal'}
                group_size: {type: integer, minimum: 1, maximum: 100000}
        split:
          oneOf:
            - {type: 'null'}
            - type: object
              additionalProperties: false
              required: [revision, name]
              properties:
                revision: {$ref: '#/components/schemas/NullableRevision'}
                name: {type: string}
    ReadBinding:
      type: object
      required: [snapshot, split, cursor]
      properties:
        snapshot: {$ref: '#/components/schemas/OpaqueId'}
        split:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/SplitSource'}
        cursor: {type: string, maxLength: 349530}
    ReadContinuation:
      type: object
      additionalProperties: false
      required: [cursor]
      properties:
        cursor: {type: string, maxLength: 349530}
    PrepareSnapshot:
      type: object
      additionalProperties: false
      required: [parent, source, schema, samples, splits, policy]
      properties:
        parent: {$ref: '#/components/schemas/NullableRevision'}
        source: {$ref: '#/components/schemas/CompositionSource'}
        schema:
          anyOf:
            - {$ref: '#/components/schemas/CompositionSchema'}
            - {type: 'null'}
        samples: {type: array, items: {$ref: '#/components/schemas/SnapshotChange'}}
        splits: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/DraftSplit'}}
        policy: {$ref: '#/components/schemas/SplitPolicy'}
    SnapshotValue:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, data]
          properties:
            kind: {const: inline}
            data: {type: string, description: Canonical padded base64 of at most 65536 decoded bytes}
        - type: object
          additionalProperties: false
          required: [kind, id, length, md5]
          properties:
            kind: {const: upload}
            id: {$ref: '#/components/schemas/OpaqueId'}
            length: {$ref: '#/components/schemas/Decimal'}
            md5: {type: string, pattern: '^[0-9a-f]{32}$'}
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {const: tombstone}
    SnapshotField:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: {type: string, minLength: 1, description: At most 1024 UTF-8 bytes}
        value: {$ref: '#/components/schemas/SnapshotValue'}
    SnapshotChange:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, id]
          properties:
            kind: {const: remove}
            id: {type: string}
        - type: object
          additionalProperties: false
          required: [kind, id, fields]
          properties:
            kind: {const: upsert}
            id: {type: string}
            fields: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/SnapshotField'}}
      description: Canonical base64 Sample IDs decode to 1 through 16384 bytes. Each ID occurs once; an upsert preserves unspecified effective parent fields.
    PreparedSnapshot:
      type: object
      required: [snapshot, initial_split, sample_count]
      properties:
        snapshot: {$ref: '#/components/schemas/OpaqueId'}
        initial_split: {$ref: '#/components/schemas/NullableRevision'}
        sample_count: {$ref: '#/components/schemas/Decimal'}
    CompositionSchema:
      type: object
      additionalProperties: false
      required:
      - version
      - fields
      properties:
        version:
          type: integer
          minimum: 0
          maximum: 4294967295
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDefinition'
          maxItems: 256
    CompositionSource:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - kind
        properties:
          kind:
            const: all
      - type: object
        additionalProperties: false
        required:
        - kind
        - predicate
        properties:
          kind:
            const: selection
          predicate:
            $ref: '#/components/schemas/Predicate'
      - type: object
        additionalProperties: false
        required:
        - kind
        - source
        properties:
          kind:
            const: split
          source:
            $ref: '#/components/schemas/SplitSource'
          selection:
            anyOf:
            - $ref: '#/components/schemas/Predicate'
            - type: 'null'
    CompositionUploadStatus:
      type: object
      additionalProperties: false
      required:
      - publication_ready
      - staged_uploads
      - candidate_uploads
      properties:
        publication_ready: {type: boolean}
        staged_uploads: {$ref: '#/components/schemas/Decimal'}
        candidate_uploads: {$ref: '#/components/schemas/Decimal'}
    CompositionDraft:
      type: object
      additionalProperties: false
      required:
      - operation
      - revision
      - parent
      - source
      - parent_split_revision
      - schema
      - splits
      - policy
      - progress
      - source_lease_deadline
      - preparation
      - uploads
      properties:
        operation: {$ref: '#/components/schemas/OpaqueId'}
        revision: {$ref: '#/components/schemas/Decimal'}
        parent:
          $ref: '#/components/schemas/NullableRevision'
        source:
          $ref: '#/components/schemas/CompositionSource'
        parent_split_revision:
          $ref: '#/components/schemas/NullableRevision'
        schema:
          $ref: '#/components/schemas/CompositionSchema'
        splits: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/DraftSplit'}}
        policy:
          $ref: '#/components/schemas/SplitPolicy'
        progress:
          $ref: '#/components/schemas/DraftProgress'
        source_lease_deadline:
          <<: {$ref: '#/components/schemas/Decimal'}
          description: Compatibility field; new drafts and edits use zero and hold no source lease.
        preparation:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - snapshot
            - split_preview
            properties:
              snapshot: {$ref: '#/components/schemas/OpaqueId'}
              split_preview:
                anyOf:
                - $ref: '#/components/schemas/SplitPreview'
                - type: 'null'
          - type: 'null'
        uploads:
          $ref: '#/components/schemas/CompositionUploadStatus'
    CompositionCleanup:
      type: object
      additionalProperties: false
      required:
      - complete
      - candidates
      - uploads
      - scratch
      - edits
      - physical_cleanup_deferred
      properties:
        complete: {type: boolean}
        candidates:
          type: object
          additionalProperties: false
          required:
          - input_revision
          - complete
          properties:
            input_revision: {$ref: '#/components/schemas/Decimal'}
            complete: {type: boolean}
        uploads:
          type: object
          additionalProperties: false
          required:
          - retired_owners
          - complete
          properties:
            retired_owners: {$ref: '#/components/schemas/Decimal'}
            complete: {type: boolean}
        scratch:
          $ref: '#/components/schemas/SplitCleanup'
        edits:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - retired_pages
            - complete
            properties:
              retired_pages: {$ref: '#/components/schemas/Decimal'}
              complete: {type: boolean}
          - type: 'null'
        physical_cleanup_deferred:
          const: true
    SplitCleanup:
      type: object
      additionalProperties: false
      required:
      - input_revision
      - next_page
      - complete
      properties:
        input_revision: {$ref: '#/components/schemas/Decimal'}
        next_page: {$ref: '#/components/schemas/Decimal'}
        complete: {type: boolean}
    CreateUpload:
      type: object
      additionalProperties: false
      required:
      - id
      - length
      - part_size
      - md5
      properties:
        id: {$ref: '#/components/schemas/OpaqueId'}
        length: {$ref: '#/components/schemas/Decimal'}
        part_size:
          type: integer
          minimum: 1
          maximum: 4194304
        md5: &composition006
          type: string
          pattern: ^[0-9a-f]{32}$
    UploadPart:
      type: object
      additionalProperties: false
      required:
      - index
      - length
      - md5
      properties:
        index:
          type: integer
          minimum: 0
        length: {$ref: '#/components/schemas/Decimal'}
        md5: *composition006
    UploadStatus:
      type: object
      additionalProperties: false
      required:
      - id
      - length
      - part_size
      - md5
      - state
      - expires_at
      - cleanup_complete
      - parts
      properties:
        id: {$ref: '#/components/schemas/OpaqueId'}
        length: {$ref: '#/components/schemas/Decimal'}
        part_size:
          type: integer
        md5: *composition006
        state:
          enum:
          - open
          - complete
          - claimed
          - aborted
        expires_at: {$ref: '#/components/schemas/Decimal'}
        cleanup_complete: {type: boolean}
        parts:
          type: array
          items:
            $ref: '#/components/schemas/UploadPart'
          maxItems: 10000
    StableSnapshot:
      type: object
      additionalProperties: false
      required:
      - snapshot
      properties:
        snapshot: {$ref: '#/components/schemas/OpaqueId'}
    RetainedSnapshot:
      type: object
      additionalProperties: false
      required:
      - snapshot
      - retained
      properties:
        snapshot: {$ref: '#/components/schemas/OpaqueId'}
        retained: {type: boolean}
    SnapshotLifecycle:
      type: object
      required: [snapshot, operation, latest, stable, retained, active_read_lease, state, physical_cleanup_deferred, parent_protection]
      properties:
        snapshot: *id001
        operation:
          type: [string, 'null']
        latest:
          type: boolean
        stable:
          type: boolean
        retained:
          type: boolean
        active_read_lease:
          type: boolean
          const: false
          description: Compatibility field; readers do not register persistent activity.
        reclaim_after:
          type: [integer, 'null']
          minimum: 0
          description: Durable Unix-seconds deadline for destructive cleanup.
        state:
          type: string
          enum: [not_started, pending, completed]
        physical_cleanup_deferred:
          type: boolean
        parent_protection:
          type: string
          const: not_evaluated
    SnapshotReclaim:
      type: object
      additionalProperties: false
      required:
      - snapshot
      - phase
      - complete
      - physical_cleanup_deferred
      properties:
        snapshot: {$ref: '#/components/schemas/OpaqueId'}
        phase:
          enum:
          - grace_period
          - upload_owners
          - split_drafts
          - index_fences
          - metadata
          - complete
        complete: {type: boolean}
        reclaim_after:
          type: integer
          minimum: 0
        physical_cleanup_deferred:
          const: true
    CommitStatus:
      type: object
      additionalProperties: false
      required:
      - receipt
      properties:
        receipt:
          anyOf:
          - $ref: '#/components/schemas/CommitReceipt'
          - type: 'null'
