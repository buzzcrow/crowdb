openapi: 3.1.0
info:
  title: CrowDB Dataset control API v2
  version: 2.0.0
  description: >-
    Capability-gated Dataset control operations. Clients must discover required
    capabilities before mutation. An absent capability is unavailable; clients
    must not downgrade a v2 mutation to v1. The capability list advertises only
    implemented operation families. Existing v1 control and binary framing remain
    available under their original routes.
servers:
  - url: /api/dataset/v2
security:
  - bearerAuth: []
paths:
  /namespaces/dataset-ns/datasets/{dataset}/head:
    get:
      operationId: datasetHead
      summary: Read mutable names and their current opaque head generation
      description: >-
        Requires head-inspection capability. Generation covers the exact head
        including its internal fence. An absent head has null generation. Stable
        changes and reclaim fences may change generation without changing latest.
        Clients must treat the token as opaque and preserve it without decoding.
      parameters:
        - in: path
          name: dataset
          required: true
          schema: {type: string}
      responses:
        '200':
          description: One consistent observation of the current head
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Head'}
        '404':
          description: Dataset or namespace is unavailable
  /capabilities:
    get:
      operationId: datasetCapabilities
      summary: Discover supported Dataset control operation families
      responses:
        '200':
          description: Supported API version and capability names
          headers:
            x-request-id:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
        '401':
          description: Missing or invalid configured bearer token
        '429':
          description: API admission capacity exhausted
        '504':
          description: Request deadline expired
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Head:
      type: object
      required: [latest, stable, generation]
      properties:
        latest:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
        stable:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
        generation:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
    Capabilities:
      type: object
      required: [api_version, capabilities]
      properties:
        api_version:
          type: integer
          const: 2
        capabilities:
          type: array
          uniqueItems: true
          items: {type: string}
          description: Unknown names may be ignored; required names must be present.
