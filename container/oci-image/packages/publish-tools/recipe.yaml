    sha256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
    target_directory: syft
  - url: https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
    sha256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    target_directory: cosign
build:
  number: 0
  script:
    - mkdir -p "$PREFIX/bin"
    - install -m 0755 syft/syft "$PREFIX/bin/"
    - install -m 0755 cosign/cosign-linux-amd64 "$PREFIX/bin/cosign"
requirements:
