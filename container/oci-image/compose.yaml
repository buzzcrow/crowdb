name: crowdb-${CROWDB_CLUSTER:-local}
services:
  node:
    image: ${CROWDB_IMAGE:-crowdb-node:dev}
    pull_policy: never
    cpus: 1
    mem_limit: 1536m
    environment:
      CROWDB_CLUSTER: ${CROWDB_CLUSTER:-local}
      CROWDB_INITIAL_VOTERS: "1"
      CROWDB_S3_PUBLIC_URI: http://127.0.0.1:${CROWDB_S3_PORT:-7135}
      CROWDB_ICEBERG_PUBLIC_URI: http://127.0.0.1:${CROWDB_ICEBERG_PORT:-8135}
      CROWDB_DATASET_PUBLIC_URI: http://127.0.0.1:${CROWDB_DATASET_PORT:-9135}
    ports:
      - "127.0.0.1:${CROWDB_UI_PORT:-6135}:6135"
      - "127.0.0.1:${CROWDB_S3_PORT:-7135}:7135"
      - "127.0.0.1:${CROWDB_ICEBERG_PORT:-8135}:8135"
      - "127.0.0.1:${CROWDB_DATASET_PORT:-9135}:9135"
    volumes:
      - node-data:/opt/crowdb/data
volumes:
  node-data:
