name: crowdb-${CROWDB_CLUSTER:-local}
services:
  node:
    image: ${CROWDB_IMAGE:-crowdb-node:dev}
    pull_policy: never
    cpus: 1
    mem_limit: 1536m
    environment:
      CROWDB_CLUSTER: ${CROWDB_CLUSTER:-local}
      CROWDB_INITIAL_VOTERS: "1"
      CROWDB_S3_PUBLIC_URI: http://127.0.0.1:${CROWDB_S3_PORT:-9091}
      CROWDB_ICEBERG_PUBLIC_URI: http://127.0.0.1:${CROWDB_ICEBERG_PORT:-9092}
      CROWDB_DATASET_PUBLIC_URI: http://127.0.0.1:${CROWDB_DATASET_PORT:-9093}
    ports:
      - "127.0.0.1:${CROWDB_UI_PORT:-9090}:9090"
      - "127.0.0.1:${CROWDB_S3_PORT:-9091}:${CROWDB_S3_CONTAINER_PORT:-16000}"
      - "127.0.0.1:${CROWDB_ICEBERG_PORT:-9092}:${CROWDB_ICEBERG_CONTAINER_PORT:-17000}"
      - "127.0.0.1:${CROWDB_DATASET_PORT:-9093}:${CROWDB_DATASET_CONTAINER_PORT:-18000}"
    volumes:
      - node-data:/opt/crowdb/data
volumes:
  node-data:
