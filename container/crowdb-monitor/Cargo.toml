[package]
name = "crowdb-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Profile-driven deployment monitor for CROWDB."
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
crowdb-kv-client = { path = "../../lib/crowdb-kv-client" }
crowdb-diskio-client = { path = "../../lib/crowdb-diskio-client" }
crowdb-protocol = { path = "../../lib/crowdb-protocol" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
crowdb-test-harness = { path = "../../lib/crowdb-test-harness", features = ["kv-client"] }
