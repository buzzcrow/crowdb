[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "crowdb-dataset"
version = "0.1.0"
description = "CrowDB Dataset HTTP SDK with a Rust core"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.maturin]
manifest-path = "crates/crowdb-sdk-python/Cargo.toml"
python-source = "."
module-name = "crowdb_dataset._native"
include = ["README.md", "crates/crowdb-sdk-core/**", "crates/crowdb-sdk-dataset/**", "Cargo.toml", "Cargo.lock", ".cargo/config.toml"]
