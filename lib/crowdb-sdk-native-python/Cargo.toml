[package]
name = "crowdb-sdk-native-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Optional trusted native Dataset Python binding"

[lib]
name = "crowdb_dataset_native"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
crowdb-sdk-native = { path = "../crowdb-sdk-native" }
crowdb-access-dataset = { path = "../crowdb-access-dataset" }
crowdb-rpc-ffi = { path = "../crowdb-rpc/ffi" }
crowdb-protocol = { path = "../crowdb-protocol" }
pyo3 = { version = "=0.29.3", features = ["auto-initialize"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

