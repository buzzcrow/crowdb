[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "crowdb-dataset-native"
version = "0.3.0"
description = "Trusted native CROWDB Dataset runtime"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.maturin]
features = ["extension-module"]
module-name = "crowdb_dataset_native"

