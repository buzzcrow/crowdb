[package]
name = "crowdb-chunk-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fenced mirrored logical byte streams over CROWDB chunks."
autobenches = false

[[bench]]
name = "production_bounds"
harness = false

[lints]
workspace = true

[features]
test-util = []

[dependencies]
arc-swap = "1.9"
async-trait = "0.1"
bytes = "1"
crc32fast = "1"
crowdb-common = { path = "../crowdb-common/rust" }
crowdb-paxos-kv-client = { path = "../crowdb-paxos-kv-client" }
crowdb-chunk-client = { path = "../crowdb-chunk-client" }
crowdb-protocol = { path = "../crowdb-protocol" }
crossbeam-skiplist = "0.1"
futures = "0.3"
serde = "1"
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
crowdb-chunk-stream = { path = ".", features = ["test-util"] }
crowdb-test-harness = { path = "../crowdb-test-harness" }
crowdb-paxos-kv = { path = "../crowdb-paxos-kv", features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
