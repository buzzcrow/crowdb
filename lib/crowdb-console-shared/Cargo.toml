[package]
name = "crowdb-console-shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
test-util = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
form_urlencoded = "1"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "process", "io-util", "net"] }
futures = "0.3"
tracing = { workspace = true }
dirs = "5"
russh = "0.45"
async-trait = "0.1"
crowdb-protocol = { path = "../crowdb-protocol" }
crowdb-paxos-kv-client = { path = "../crowdb-paxos-kv-client" }

[dev-dependencies]
bincode = "1"
clap = { version = "4", features = ["derive"] }
crowdb-paxos-kv-server = { path = "../../app/crowdb-paxos-kv-server" }
crowdb-paxos-kv = { path = "../crowdb-paxos-kv" }
crowdb-console-shared = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
axum = "0.7"
# KV data-plane crowdb-rpc client for `tests/kv_e2e_test.rs` (C6's own crowdb-rpc
# `KvClient` wrapper is gone; that test now exercises the real
# `crowdb-paxos-kv-client` crate end-to-end instead).
crowdb-paxos-kv-client = { path = "../crowdb-paxos-kv-client" }
crowdb-chunkdb-client = { path = "../crowdb-chunkdb-client" }
crowdb-rpc-ffi = { path = "../crowdb-rpc/ffi", features = ["test-util"] }
crowdb-test-harness = { path = "../crowdb-test-harness" }

[[example]]
name = "regression-fixture"
path = "tests/common/regression_fixture.rs"
required-features = ["test-util"]
